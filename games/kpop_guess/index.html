*,*::before,*::after{box-sizing:border-box}
:root{color-scheme:dark; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);

html,body{height:100%}

button{font:inherit; color:inherit; cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:3px}
.app{height:100%; display:grid; grid-template-rows:1fr auto; gap:10px; padding-block:14px}

.stage{--u:calc(min(100cqw, 100cqh) / 100); position:relative; width:min(100cqw, 100cqh); aspect-ratio:1/1; max-width:100%;

.layer{position:absolute; inset:0}
.layer img{width:100%; height:100%; object-fit:cover; display:block}
.now{opacity:0; transition:opacity .22s}
.stage.rev .now{opacity:1}
.stage.snap .now,.stage.snap .answer{transition:none!important}
.shade{position:absolute; left:0; right:0; bottom:0; height:55%; pointer-events:none;
  background:linear-gradient(180deg, transparent, rgba(8,6,12,.55) 35%, rgba(8,6,12,.93)); opacity:.6; transition:opacity .22s}
.stage.rev .shade{opacity:1}
.top{position:absolute; top:calc(var(--u)*4); left:calc(var(--u)*4); right:calc(var(--u)*4); display:flex; justify-content:space-between; align-items:center; z-index:3}
.pill{font-size:calc(var(--u)*3.6); font-weight:700; font-variant-numeric:tabular-nums; padding:.35em .9em; border-radius:99px;

.answer{text-align:center; opacity:0; transform:translateY(8px); transition:opacity .22s, transform .22s}
.stage.rev .answer{opacity:1; transform:none}
.name{font-family:var(--display); font-weight:800; text-transform:uppercase; line-height:.95; font-size:calc(var(--u)*9.5); text-wrap:balance}
.group{margin-top:calc(var(--u)*2); font-family:var(--display); font-weight:500; text-transform:uppercase; font-size:calc(var(--u)*4.6); letter-spacing:.2em; color:var(--accent)}
.go{width:100%; border:0; border-radius:99px; padding:calc(var(--u)*3.2) 0; background:var(--fg); color:#120e17;

.mk{border:0; border-radius:99px; padding:calc(var(--u)*3.2) 0; font-weight:900; font-size:calc(var(--u)*4.6)}

.sub{font-size:calc(var(--u)*4.2); color:var(--muted)}

.row{display:flex; flex-wrap:wrap; justify-content:center; gap:calc(var(--u)*2)}
.btn{border:0; border-radius:99px; padding:calc(var(--u)*2.4) calc(var(--u)*4.2); font-weight:900; font-size:calc(var(--u)*3.6); text-decoration:none;

.btn.ghost{background:transparent; color:var(--fg); box-shadow:inset 0 0 0 2px var(--line)}
.btn.light{background:var(--fg); color:#120e17}
.mini{width:100%; display:grid; gap:calc(var(--u)*1.2); padding-top:calc(var(--u)*1.8); border-top:1px dashed var(--line)}
.lbl{font-weight:700; font-size:calc(var(--u)*3.2); color:var(--muted)}
.chips{display:flex; gap:calc(var(--u)*1.8); justify-content:center}
.chip{border:1px solid var(--line); background:var(--panel); border-radius:99px; font-size:calc(var(--u)*5); padding:calc(var(--u)*.6) calc(var(--u)*2.8)}
.chip.on{background:var(--accent); border-color:var(--accent)}

.credit{text-align:center; font-size:11.5px; color:var(--muted); line-height:1.5}

.toast{position:fixed; left:50%; top:calc(14px + env(safe-area-inset-top,0px)); transform:translateX(-50%); z-index:50; background:var(--panel);

const RANKS = [[1,'行走的 K-pop 百科'],[.8,'骨灰級粉絲'],[.55,'認證粉絲'],[.3,'一般粉絲'],[0,'路人粉']];
const $ = id => document.getElementById(id);
const stage = $('stage');
function track(n, p){ try{ if(typeof gtag === 'function') gtag('event', n, p || {}); }catch(e){} }
const store = { get(k){ try{ return localStorage.getItem('kpq.' + k); }catch(e){ return null; } }, set(k, v){ try{ localStorage.setItem('kpq.' + k, v); }catch(e){} } };
let deck = [], idx = -1, rev = false, score = 0, round = 0;
const N = ROUNDS.length;
const rankFor = s => RANKS.find(([t]) => N && s / N >= t)[1];
let rival = parseInt(new URLSearchParams(location.search).get('vs'), 10);
if(!(rival >= 0 && rival <= N)) rival = null;

$('introN').textContent = `${N} 題・猜完可以挑戰朋友`;
if(rival !== null){ $('vsIntro').hidden = false; $('vsIntro').textContent = `你的朋友猜對 ${rival} / ${N}（${rankFor(rival)}），你能贏過她嗎？`; $('start').textContent = '接受挑戰'; track('challenge_open', {rival_score: rival}); }
$('more').href = MORE_GAMES_URL;
if(IG_URL) $('ig').href = IG_URL; else $('igT').hidden = true;
$('comment').href = LATEST_VIDEO_URL || IG_URL || '#'; if(!LATEST_VIDEO_URL && !IG_URL) $('comment').hidden = true;

const keep = []; function preload(u){ if(!u) return; const i = new Image(); i.src = u; keep.push(i); if(keep.length > 8) keep.shift(); }
function shuffle(a){ for(let i = a.length - 1; i > 0; i--){ const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }

function render(snap){
  stage.dataset.mode = idx < 0 ? 'intro' : idx >= N ? 'end' : 'play';
  stage.classList.toggle('rev', rev);
  if(snap){ stage.classList.add('snap'); }
  $('sc').textContent = score;
  if(idx >= N){
    $('final').innerHTML = `${score}<small> / ${N}</small>`; $('rank').textContent = rankFor(score);
    if(rival !== null){ $('vsEnd').hidden = false; $('vsEnd').textContent = score > rival ? `你贏了朋友（${rival}）！快去嗆她 😎` : score === rival ? `跟朋友平手（${rival}），再來一場？` : `輸給朋友（${rival}）了… 再挑戰一次？`; }
    chips(); return;
  }
  if(idx >= 0){
    const r = deck[idx];
    $('prog').textContent = `${idx + 1} / ${N}`;
    $('kid').src = r.kid; $('now').src = r.now || r.kid;
    $('name').textContent = r.name; $('group').textContent = r.group;
    const nx = deck[idx + 1]; if(nx){ preload(nx.kid); preload(nx.now); }
  } else if(N){ preload(ROUNDS[0].kid); }
  if(snap){ void stage.offsetWidth; requestAnimationFrame(() => stage.classList.remove('snap')); }
}
function start(){ deck = shuffle([...ROUNDS]); idx = 0; rev = false; score = 0; round = Date.now(); track('quiz_start', {game:'kpop_childhood', challenged: rival !== null}); render(true); }
function reveal(){ if(stage.dataset.mode === 'intro') return start(); if(stage.dataset.mode === 'play' && !rev){ rev = true; render(); } }
function mark(ok){
  if(stage.dataset.mode !== 'play' || !rev) return;
  if(ok) score++;
  track('question_answered', {game:'kpop_childhood', question_no: idx + 1, question_text: deck[idx].name, correct: ok});
  idx++; rev = false; render(true);
  if(idx >= N) track('quiz_complete', {game:'kpop_childhood', score, total: N, rank: rankFor(score)});
}
function chips(){
  const key = 'rate:' + round, done = store.get(key), el = $('rate');
  el.innerHTML = ['😕','🙂','🤩'].map(t => `<button class="chip${done === t ? ' on' : ''}" data-v="${t}">${t}</button>`).join('');
  el.classList.toggle('done', !!done);
  el.onclick = e => { const b = e.target.closest('.chip'); if(!b || store.get(key)) return; store.set(key, b.dataset.v); track('quiz_rating', {game:'kpop_childhood', rating: b.dataset.v}); chips(); toast('收到，謝謝！'); };
}
function shareUrl(){ const u = new URL(location.href); u.hash = ''; u.search = ''; u.searchParams.set('vs', score); return u.toString(); }
async function share(){
  const text = `我看童年照猜女團成員，猜對 ${score}/${N} 個，是「${rankFor(score)}」！你能贏過我嗎？\n${shareUrl()}${IG_HANDLE ? '\n' + IG_HANDLE : ''}`;
  track('share_click', {game:'kpop_childhood', score});
  try{ if(navigator.share){ await navigator.share({text}); return; } }catch(e){ if(e && e.name === 'AbortError') return; }
  try{ await navigator.clipboard.writeText(text); toast('已複製，貼給朋友吧！'); }catch(e){ toast('複製失敗，請截圖分享'); }
}
$('go').onclick = reveal; $('start').onclick = start;
$('yes').onclick = () => mark(true); $('no').onclick = () => mark(false);
$('again').onclick = () => { track('play_again', {game:'kpop_childhood'}); start(); };
$('share').onclick = share;
$('comment').addEventListener('click', () => { try{ navigator.clipboard.writeText(`${rankFor(score)} ${score}/${N} 💖`).then(() => toast('已複製留言，貼到影片底下吧！'), () => {}); }catch(e){} track('comment_click', {game:'kpop_childhood', score}); });
$('ig').addEventListener('click', () => track('ig_click', {location:'kpop_end'}));
$('more').addEventListener('click', () => track('more_games_click', {game:'kpop_childhood'}));
document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if(e.code === 'Space' || k === 'enter'){ if(e.target.tagName === 'A') return; e.preventDefault(); reveal(); }
  else if(k === 'y' || k === '1') mark(true);
  else if(k === 'n' || k === '2') mark(false);
});
let tt; function toast(m){ const el = $('toast'); el.textContent = m; el.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('show'), 2200); }
render();
</script>
