<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>全台灣有多少人跟你同姓？</title>
<meta name="description" content="拖動滑桿猜猜看，全台灣姓陳、姓歐陽、姓張簡的各有多少人？資料來自內政部全國姓名統計分析。">
<meta property="og:title" content="全台灣有多少人跟你同姓？">
<meta property="og:description" content="拖動滑桿猜姓氏人口，10 題挑戰 1000 分！">
<meta name="theme-color" content="#FFF8ED">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%8E%AE</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-C77ELCKPVB"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-C77ELCKPVB');</script>
<style>
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
:root{
  --cream:#FFF8ED; --mint:#9FD8B0; --pink:#F6A3B6; --blue:#A9D6F2; --ink:#252525; --soft:#7b7166; --line:#eadfcf;
  --page:#FFF8ED; --card:#ffffff; --accent:#F6A3B6; --ok:#2f9e6b; --bad:#e5484d; --gold:#f2b233;
  --round:'Huninn','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0; background:var(--page); color:var(--ink); font-family:var(--sans); -webkit-tap-highlight-color:transparent}
button,input{font:inherit; color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--ink); outline-offset:3px}

.app{max-width:520px; min-height:100%; margin:0 auto; padding:16px 16px 28px; display:flex; flex-direction:column; gap:14px}
.top{display:flex; align-items:center; justify-content:space-between; gap:10px}
.brand{font-family:var(--round); font-size:20px; text-decoration:none; display:flex; align-items:center; gap:8px; background:none; border:0; padding:0}
.brand i{width:30px; height:30px; border-radius:10px; background:var(--pink); display:grid; place-items:center; font-style:normal; font-size:16px; border:2px solid var(--ink)}
.nav{display:flex; gap:6px}
.chipbtn{border:2px solid var(--ink); background:var(--card); border-radius:99px; padding:6px 12px; font-size:13px; font-weight:700}
.chipbtn.on{background:var(--ink); color:var(--cream)}

.card{background:var(--card); border:2.5px solid var(--ink); border-radius:24px; box-shadow:5px 5px 0 var(--ink); padding:20px}
.view{display:flex; flex-direction:column; gap:14px}
h1,h2,h3{margin:0}
.hero h1{font-family:var(--round); font-weight:400; font-size:clamp(34px, 9vw, 46px); line-height:1.15}
.hero p{margin:8px 0 0; color:var(--soft); font-weight:700}
.bigbtn{display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%; text-align:left; border:2.5px solid var(--ink); border-radius:22px;
  padding:18px 20px; box-shadow:5px 5px 0 var(--ink); font-weight:900; font-size:19px; transition:transform .08s, box-shadow .08s}
.bigbtn small{display:block; font-weight:700; font-size:13px; opacity:.75; margin-top:3px}
.bigbtn:active{transform:translate(4px,4px); box-shadow:1px 1px 0 var(--ink)}
.bigbtn .em{font-size:30px}
.b-mint{background:var(--mint)} .b-pink{background:var(--pink)} .b-blue{background:var(--blue)} .b-cream{background:var(--card)}
.facts{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.fact{background:var(--card); border:2px solid var(--ink); border-radius:18px; padding:12px 14px}
.fact b{display:block; font-family:var(--round); font-weight:400; font-size:24px}
.fact span{font-size:12.5px; color:var(--soft); font-weight:700}
.src{font-size:12px; color:var(--soft); line-height:1.6}
.src a{color:var(--ink)}

/* 遊戲畫面 */
.play{display:flex; flex-direction:column; gap:14px}
.phead{display:flex; justify-content:space-between; align-items:center}
.pill{background:var(--ink); color:var(--cream); border-radius:99px; padding:6px 14px; font-weight:900; font-variant-numeric:tabular-nums}
.pts{font-weight:900; font-variant-numeric:tabular-nums}
.qcard{text-align:center; background:var(--blue)}
.qcard .lbl{font-weight:700; color:#2c4a5e}
.qname{font-family:var(--round); font-size:clamp(64px, 22vw, 108px); line-height:1.05; margin:6px 0}
.qnote{font-size:13px; font-weight:700; color:#2c4a5e}
.guess{text-align:center}
.guess .lbl{font-weight:700; color:var(--soft)}
.num{font-family:var(--sans); font-weight:900; font-size:clamp(46px, 14vw, 72px); line-height:1.1; font-variant-numeric:tabular-nums; letter-spacing:-.02em}
.num small{font-size:.38em; font-weight:700; margin-left:4px}
.slider{position:relative; height:44px; margin:10px 4px 2px; touch-action:none}
.slider input{width:100%; height:44px; margin:0; -webkit-appearance:none; appearance:none; background:transparent}
.slider input::-webkit-slider-runnable-track{height:16px; border-radius:99px; border:2.5px solid var(--ink); background:linear-gradient(90deg,var(--mint),var(--blue),var(--pink))}
.slider input::-moz-range-track{height:12px; border-radius:99px; border:2.5px solid var(--ink); background:linear-gradient(90deg,var(--mint),var(--blue),var(--pink))}
.slider input::-webkit-slider-thumb{-webkit-appearance:none; width:38px; height:38px; margin-top:-13px; border-radius:50%; background:var(--card); border:3px solid var(--ink); box-shadow:3px 3px 0 var(--ink)}
.slider input::-moz-range-thumb{width:32px; height:32px; border-radius:50%; background:var(--card); border:3px solid var(--ink)}
.ticks{display:flex; justify-content:space-between; font-size:11px; font-weight:700; color:var(--soft); padding:0 6px}
.adj{display:grid; grid-template-columns:56px 1fr 56px; gap:10px; align-items:center; margin-top:12px}
.adj button{height:50px; border:2.5px solid var(--ink); border-radius:16px; background:var(--card); font-size:26px; font-weight:900; box-shadow:3px 3px 0 var(--ink)}
.adj button:active{transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink)}
.adj input{height:50px; width:100%; min-width:0; text-align:center; border:2.5px solid var(--ink); border-radius:16px; background:var(--cream); font-weight:900; font-size:20px; font-variant-numeric:tabular-nums}
.go{width:100%; border:2.5px solid var(--ink); border-radius:99px; background:var(--ink); color:var(--cream); padding:16px; font-weight:900; font-size:20px; letter-spacing:.06em}
.go:active{transform:scale(.98)}
.go.alt{background:var(--card); color:var(--ink)}

/* 揭曉 */
.reveal{text-align:center; display:flex; flex-direction:column; gap:10px; position:relative; overflow:hidden}
.reveal.in{animation:rev .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes rev{0%{transform:scale(.85); opacity:0}100%{transform:none; opacity:1}}
.rgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.rbox{border:2px solid var(--ink); border-radius:16px; padding:10px; background:var(--cream)}
.rbox span{display:block; font-size:12.5px; font-weight:700; color:var(--soft)}
.rbox b{font-weight:900; font-size:22px; font-variant-numeric:tabular-nums}
.rbox.answer{grid-column:1 / -1; background:var(--mint)}
.rbox.answer b{font-size:clamp(38px, 11vw, 56px)}
.gain{font-family:var(--round); font-size:44px; line-height:1}
.gain small{font-size:16px; font-family:var(--sans); font-weight:700}
.quip{font-weight:900; font-size:18px}
.bar{height:14px; border-radius:99px; border:2px solid var(--ink); overflow:hidden; background:var(--cream)}
.bar i{display:block; height:100%; width:0; background:var(--gold); transition:width .8s ease-out}
.confetti{position:absolute; inset:0; pointer-events:none}
.confetti i{position:absolute; top:-12px; width:9px; height:14px; border-radius:2px; animation:fall 1.1s ease-in forwards}
@keyframes fall{to{transform:translateY(520px) rotate(540deg); opacity:0}}

/* 搜尋與排行榜 */
.search{display:flex; gap:8px}
.search input{flex:1; min-width:0; height:52px; border:2.5px solid var(--ink); border-radius:16px; padding:0 16px; font-size:20px; font-weight:700; background:var(--card)}
.search button{border:2.5px solid var(--ink); border-radius:16px; background:var(--pink); font-weight:900; padding:0 18px}
.sugg{display:flex; flex-wrap:wrap; gap:8px}
.sugg button{border:2px solid var(--ink); background:var(--card); border-radius:99px; padding:7px 14px; font-weight:900; font-size:16px}
.msg{font-weight:700; color:var(--bad); min-height:1.4em}
.tabs{display:flex; flex-wrap:wrap; gap:6px}
.list{display:flex; flex-direction:column; gap:8px}
.row{display:grid; grid-template-columns:44px 1fr auto; align-items:center; gap:10px; width:100%; text-align:left; border:2px solid var(--ink); border-radius:16px; background:var(--card); padding:10px 12px}
.row .rk{width:36px; height:36px; border-radius:50%; display:grid; place-items:center; background:var(--cream); border:2px solid var(--ink); font-weight:900; font-size:13px}
.row .nm{font-family:var(--round); font-size:24px}
.row .nm small{font-family:var(--sans); font-size:12px; font-weight:700; color:var(--soft); margin-left:6px}
.row .ct{font-weight:900; font-variant-numeric:tabular-nums}
.row .barw{grid-column:2 / -1; height:6px; border-radius:99px; background:var(--cream); overflow:hidden}
.row .barw i{display:block; height:100%; background:var(--blue)}
.pair{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px; text-align:center}
.pair b{font-family:var(--round); font-weight:400; font-size:34px; display:block}
.pair span{font-weight:900; font-variant-numeric:tabular-nums}
.pair .vs{font-weight:900; color:var(--soft)}
.section-t{font-family:var(--round); font-size:22px}
.note{font-size:13px; color:var(--soft); font-weight:700; line-height:1.6}

/* 結算 */
.final{text-align:center; background:var(--pink)}
.final .big{font-family:var(--sans); font-weight:900; font-size:clamp(60px, 18vw, 88px); line-height:1; font-variant-numeric:tabular-nums}
.final .big small{font-size:.35em}
.title{display:inline-block; background:var(--ink); color:var(--cream); font-family:var(--round); font-size:24px; border-radius:14px; padding:6px 16px; margin-top:8px}
.btns{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.btns .go{font-size:16px; padding:14px}
.recap{display:flex; flex-direction:column; gap:6px}
.recap div{display:grid; grid-template-columns:1fr auto auto; gap:10px; font-weight:700; border-bottom:2px dashed var(--line); padding:6px 2px; font-variant-numeric:tabular-nums}
.recap b{font-family:var(--round); font-weight:400; font-size:18px}

/* 錄影工具 */
.recbar{display:flex; flex-wrap:wrap; gap:6px; align-items:center; justify-content:center}
.recpanel textarea{width:100%; min-height:70px; border:2px solid var(--ink); border-radius:14px; padding:10px; font-size:16px; font-family:var(--sans); background:var(--cream)}
.sheet{position:fixed; inset:0; z-index:40; background:rgba(37,37,37,.6); display:grid; place-items:center; padding:16px}
.sheet .box{width:min(380px,100%); display:grid; gap:10px; text-align:center; background:var(--card); border:2.5px solid var(--ink); border-radius:22px; padding:16px}
.sheet img{width:100%; border-radius:14px; border:2px solid var(--ink)}
.toast{position:fixed; left:50%; top:16px; transform:translateX(-50%); z-index:60; background:var(--ink); color:var(--cream); padding:9px 16px; border-radius:99px; font-size:14px; font-weight:700; opacity:0; pointer-events:none; transition:opacity .25s}
.toast.show{opacity:1}

/* 錄影模式：9:16、字放大、藏導覽（字級跟著畫面欄位大小走） */
body.rec{overflow:hidden}
body.rec .app{max-width:none; width:min(100vw, calc(100vh * 9 / 16)); height:100vh; padding:10vh 5% 17vh; justify-content:center; gap:2vh; container-type:size}
body.rec .top, body.rec .hide-rec, body.rec .recbar{display:none}
body.rec .card{padding:2.2cqh 5cqw; border-radius:4cqw}
body.rec .pill{font-size:2.4cqh}
body.rec .pts{font-size:2.6cqh}
body.rec .qname{font-size:min(11cqh, 30cqw); margin:.6cqh 0}
body.rec .qcard .lbl, body.rec .guess .lbl, body.rec .qnote{font-size:2.4cqh}
body.rec .num{font-size:min(8cqh, 15cqw)}
body.rec .slider{height:6cqh; margin-top:1.5cqh} body.rec .slider input{height:6cqh}
body.rec .slider input::-webkit-slider-thumb{width:5cqh; height:5cqh; margin-top:-2cqh}
body.rec .ticks{font-size:1.6cqh}
body.rec .adj{grid-template-columns:7cqh 1fr 7cqh; margin-top:1.5cqh}
body.rec .adj button, body.rec .adj input{height:6cqh; font-size:2.8cqh}
body.rec .go{font-size:3cqh; padding:1.8cqh}
body.rec .rbox span{font-size:1.9cqh}
body.rec .rbox b{font-size:3.2cqh}
body.rec .rbox.answer b{font-size:min(8cqh, 15cqw)}
body.rec .gain{font-size:6cqh}
body.rec .quip{font-size:2.8cqh}
body.rec .exit-rec{display:block!important}
.exit-rec{display:none; position:fixed; right:10px; top:10px; z-index:30; opacity:.15; border:0; background:var(--ink); color:var(--cream); border-radius:99px; padding:6px 10px; font-size:12px}
.exit-rec:hover{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="top">
    <button class="brand" data-go="home"><i>姓</i>同姓人口挑戰</button>
    <div class="nav"><button class="chipbtn" data-go="rank">排行榜</button><button class="chipbtn" id="recToggle">錄影模式</button></div>
  </div>

  <!-- 首頁 -->
  <section class="view" id="v-home">
    <div class="card hero">
      <h1>全台灣有多少人<br>跟你同姓？</h1>
      <p>拖動滑桿猜人數，越接近分數越高</p>
    </div>
    <button class="bigbtn b-mint" data-go="challenge"><span>開始挑戰 10 個台灣姓氏<small>每題 100 分，滿分 1000</small></span><span class="em">🎯</span></button>
    <button class="bigbtn b-pink" data-go="lookup"><span>查查你的姓氏有多少人！<small>先猜再揭曉，看你準不準</small></span><span class="em">🔍</span></button>
    <button class="bigbtn b-blue" data-go="rank"><span>台灣姓氏人口排行榜<small>前十大姓、複姓、異體字</small></span><span class="em">🏆</span></button>
    <div class="facts" id="homeFacts"></div>
    <div class="src hide-rec" id="srcNote"></div>
    <div class="src hide-rec"><a id="moreGames" href="../" style="color:inherit">← 更多遊戲</a></div>
  </section>

  <!-- 猜測畫面（10 題挑戰與查姓氏共用） -->
  <section class="view" id="v-play" hidden>
    <div class="phead"><div class="pill" id="pProg">1 / 10</div><div class="pts" id="pPts">0 分</div></div>
    <div class="card qcard"><div class="lbl" id="qLbl">全台灣姓</div><div class="qname" id="qName">陳</div><div class="qnote" id="qNote"></div><div class="lbl" id="qTail">的人有多少？</div></div>
    <div class="card guess" id="guessCard">
      <div class="lbl">你猜</div>
      <div class="num" id="gNum">10,000<small>人</small></div>
      <div class="slider"><input type="range" id="gRange" min="0" max="1000" step="1" aria-label="猜測人數"></div>
      <div class="ticks"><span>1</span><span>100</span><span>1萬</span><span>100萬</span><span>500萬</span></div>
      <div class="adj"><button id="gMinus" aria-label="減少">−</button><input id="gInput" inputmode="numeric" aria-label="直接輸入人數"><button id="gPlus" aria-label="增加">＋</button></div>
    </div>
    <div class="card reveal" id="revealCard" hidden></div>
    <button class="go" id="pGo">確認答案</button>
    <div class="recbar hide-rec" id="playTools"><button class="chipbtn" id="redoBtn">重猜這題</button><button class="chipbtn" id="quitBtn">回首頁</button></div>
  </section>

  <!-- 查姓氏 -->
  <section class="view" id="v-lookup" hidden>
    <div class="card"><h2 class="section-t">輸入你的姓氏</h2>
      <p class="note">先猜再揭曉。複姓請輸入完整姓氏，例如「歐陽」「張簡」。</p>
      <div class="search"><input id="lkInput" list="lkList" placeholder="例如：歐陽" maxlength="4" autocomplete="off"><button id="lkGo">開始猜</button></div>
      <datalist id="lkList"></datalist>
      <div class="msg" id="lkMsg"></div>
      <div class="sugg" id="lkSugg"></div>
    </div>
    <div class="src" id="lkNote"></div>
  </section>

  <!-- 排行榜 -->
  <section class="view" id="v-rank" hidden>
    <div class="card"><h2 class="section-t">台灣姓氏人口排行榜</h2>
      <div class="search" style="margin-top:10px"><input id="rkInput" placeholder="搜尋姓氏" maxlength="4" autocomplete="off"></div>
      <div class="tabs" style="margin-top:10px" id="rkTabs"></div>
    </div>
    <div class="list" id="rkList"></div>
    <div class="card" id="rkVariants"></div>
    <div class="src" id="rkNote"></div>
  </section>

  <!-- 10 題結算 -->
  <section class="view" id="v-final" hidden>
    <div class="card final">
      <div style="font-weight:900">台灣姓氏人口挑戰</div>
      <div class="big" id="fScore">0<small> / 1000</small></div>
      <div class="title" id="fTitle"></div>
      <div style="font-weight:700; margin-top:8px" id="fLine"></div>
    </div>
    <div class="card recap" id="fRecap"></div>
    <div class="btns hide-rec"><button class="go" id="fShare">分享結果</button><button class="go alt" id="fImg">存成績圖</button><button class="go alt" id="fAgain">再挑戰一次</button><button class="go alt" data-go="lookup">查我的姓氏</button></div>
  </section>

  <!-- 錄影設定 -->
  <section class="view" id="v-recset" hidden>
    <div class="card recpanel"><h2 class="section-t">錄影用：自己指定 10 個姓氏</h2>
      <p class="note">用逗號或空白隔開，照你打的順序出題。只能用資料庫裡有的姓氏。</p>
      <textarea id="recList"></textarea>
      <div class="msg" id="recMsg"></div>
      <div class="btns"><button class="go" id="recStart">照這個順序開始</button><button class="go alt" id="recRandom">用隨機題目</button></div>
      <p class="note" style="margin-top:10px">快捷鍵：Enter 確認答案 · 空白鍵／→ 下一題 · ↑↓ 微調 · R 錄影模式 · Esc 離開錄影模式。錄影模式下答案一定要按確認才會出現。</p>
    </div>
  </section>
</div>
<button class="exit-rec" id="exitRec">離開錄影模式</button>
<div class="sheet" id="sheet" hidden><div class="box"><img id="sheetImg" alt="成績圖"><div class="btns"><button class="go" id="sheetShare">分享</button><a class="go alt" id="sheetDl" download="surname-score.png" href="#" style="text-decoration:none">下載</a></div><button class="go alt" id="sheetClose">關閉</button></div></div>
<div class="toast" id="toast"></div>

<script>window.EMBEDDED_SURNAMES = {"source": {"title": "全國姓名統計分析（107年）", "publisher": "中華民國內政部戶政司", "data_date": "2018-06-30", "published": "2018-10", "url": "https://www.ris.gov.tw/documents/data/5/2/107namestat.pdf", "index_url": "https://www.ris.gov.tw/documents/html/5/2/popudata-quart-pub.html", "tables_used": ["表三 全國前十大姓人口數及百分比", "表五 全國前五大複姓人口數及百分比", "同一姓氏不同字體（統計表五十七，報告內文所列人數）"], "total_population": 23574274, "total_surnames": 1832, "compound_surnames": 110, "note": "本檔只收錄 107 年報告中『有逐姓公布人數』的 22 筆；其餘約 1,810 個姓氏在這份報告摘要中沒有逐姓人數，因此沒有收錄，也沒有自行推估。異體字（如 溫/温）依官方方式分開統計。排名只在官方有排名時才填。"}, "surnames": [{"name": "陳", "count": 2627995, "rank": 1, "tags": ["top10"]}, {"name": "林", "count": 1960443, "rank": 2, "tags": ["top10"]}, {"name": "黃", "count": 1426788, "rank": 3, "tags": ["top10"], "variant_of": null}, {"name": "張", "count": 1242595, "rank": 4, "tags": ["top10"]}, {"name": "李", "count": 1208829, "rank": 5, "tags": ["top10"]}, {"name": "王", "count": 967622, "rank": 6, "tags": ["top10"]}, {"name": "吳", "count": 952464, "rank": 7, "tags": ["top10"]}, {"name": "劉", "count": 743179, "rank": 8, "tags": ["top10"]}, {"name": "蔡", "count": 686717, "rank": 9, "tags": ["top10"]}, {"name": "楊", "count": 626244, "rank": 10, "tags": ["top10"]}, {"name": "高", "count": 181471, "rank": null, "tags": ["variant"], "note": "另一種寫法「髙」分開統計"}, {"name": "温", "count": 42016, "rank": null, "tags": ["variant"], "note": "跟「溫」是同一個姓，分開統計"}, {"name": "黄", "count": 35905, "rank": null, "tags": ["variant"], "note": "「黃」的另一種寫法，分開統計"}, {"name": "溫", "count": 14097, "rank": null, "tags": ["variant"], "note": "跟「温」是同一個姓，分開統計"}, {"name": "張簡", "count": 9059, "rank": null, "compound_rank": 1, "tags": ["compound"]}, {"name": "歐陽", "count": 7860, "rank": null, "compound_rank": 2, "tags": ["compound"]}, {"name": "范姜", "count": 4300, "rank": null, "compound_rank": 3, "tags": ["compound"]}, {"name": "龎", "count": 2270, "rank": null, "tags": ["variant"], "note": "跟「龐」是同一個姓，分開統計"}, {"name": "龐", "count": 1173, "rank": null, "tags": ["variant"], "note": "跟「龎」是同一個姓，分開統計"}, {"name": "髙", "count": 1050, "rank": null, "tags": ["variant"], "note": "「高」的另一種寫法，分開統計"}, {"name": "周黃", "count": 590, "rank": null, "compound_rank": 4, "tags": ["compound"]}, {"name": "江謝", "count": 523, "rank": null, "compound_rank": 5, "tags": ["compound"]}]};</script>
<script>
/* ============ 設定 ============ */
const DATA_URL = 'data/surnames.json';     // 相對路徑，放在 GitHub Pages 子資料夾也能用
const IG_URL = 'https://www.instagram.com/whatistruthqq/';
const IG_HANDLE = '@whatistruthqq';
const MAXV = 5000000;                       // 滑桿上限
const L = Math.log10(MAXV);

/* ============ 工具 ============ */
const $ = id => document.getElementById(id);
const fmt = n => Math.round(n).toLocaleString('en-US');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { for(let i = a.length - 1; i > 0; i--){ const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
function track(n, p){ try{ if(typeof gtag === 'function') gtag('event', n, Object.assign({quiz:'surname'}, p || {})); }catch(e){} }
let tt; function toast(m){ const el = $('toast'); el.textContent = m; el.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('show'), 2200); }

/* 滑桿：對數映射。位置 0~1000 → 人數 1~500 萬 */
function posToVal(p){ return nice(Math.pow(10, p / 1000 * L)); }
function valToPos(v){ return Math.round(Math.log10(Math.max(1, v)) / L * 1000); }
function nice(v){ v = Math.max(1, Math.min(MAXV, v)); if(v < 100) return Math.round(v); const m = Math.pow(10, Math.floor(Math.log10(v)) - 2); return Math.round(v / m) * m; }
function stepOf(v){ return v < 10 ? 1 : Math.pow(10, Math.floor(Math.log10(v)) - 1); }

/* 計分：看「差了幾倍」。猜中 100 分，差 10 倍 50 分，差 100 倍以上 0 分 */
function scoreOf(g, a){ const d = Math.abs(Math.log10(Math.max(1, g) / Math.max(1, a))); return Math.max(0, Math.round(100 * (1 - d / 2))); }
function quipOf(s){ return s >= 95 ? '神準！你是戶政事務所派來的嗎？' : s >= 80 ? '超接近，很有感覺！' : s >= 60 ? '有抓到大概的規模' : s >= 35 ? '差了好幾倍，再接再厲' : '完全不同世界的數字 😂'; }
const TITLES = [[900,'人口普查之神'],[750,'戶政達人'],[550,'姓氏觀察家'],[350,'路過的鄉民'],[0,'姓氏小白']];
const titleOf = s => TITLES.find(([t]) => s >= t)[1];

/* ============ 資料 ============ */
let D = null, BY = {};
async function loadData(){
  if(window.EMBEDDED_SURNAMES) return window.EMBEDDED_SURNAMES;
  const r = await fetch(DATA_URL, {cache:'no-cache'}); if(!r.ok) throw new Error(r.status); return r.json();
}
const PAIRS = [['溫','温'],['高','髙'],['黃','黄'],['龐','龎']];   // 同一個姓的不同寫法（官方分開統計）
function tier(s){ return s.count >= 500000 ? 0 : s.count >= 10000 ? 1 : s.count >= 3000 ? 2 : 3; }
function pctOf(s){ return s.count / D.source.total_population * 100; }

/* ============ 畫面切換 ============ */
const VIEWS = ['home','play','lookup','rank','final','recset'];
function show(v){ VIEWS.forEach(x => $('v-' + x).hidden = x !== v); window.scrollTo(0, 0); }
document.addEventListener('click', e => { const b = e.target.closest('[data-go]'); if(!b) return; const g = b.dataset.go;
  if(g === 'home') show('home'); if(g === 'rank'){ renderRank(); show('rank'); } if(g === 'lookup'){ openLookup(); } if(g === 'challenge'){ startChallenge(); } });

/* ============ 猜測流程 ============ */
let mode = 'challenge', deck = [], qi = 0, total = 0, results = [], val = 10000, revealed = false;
function pickDeck(){
  const t = [[],[],[],[]]; D.surnames.forEach(s => t[tier(s)].push(s)); t.forEach(shuffle);
  const want = [3,3,2,2], out = [];
  want.forEach((n, i) => { for(let k = 0; k < n; k++){ const s = t[i].shift() || [2,1,3,0].map(j => t[j].shift()).find(Boolean); if(s) out.push(s); } });
  return out;
}
function startChallenge(list){ mode = 'challenge'; deck = list || pickDeck(); qi = 0; total = 0; results = []; track('quiz_start', {custom: !!list}); openQ(); }
function startLookup(s){ mode = 'lookup'; deck = [s]; qi = 0; total = 0; results = []; track('lookup_start'); openQ(); }
function setVal(v, fromRange){ val = Math.max(1, Math.min(MAXV, Math.round(v))); $('gNum').innerHTML = `${fmt(val)}<small>人</small>`;
  if(!fromRange) $('gRange').value = valToPos(val); if(document.activeElement !== $('gInput')) $('gInput').value = fmt(val); }
function openQ(){
  const s = deck[qi]; revealed = false; show('play');
  $('pProg').textContent = mode === 'lookup' ? '你的姓氏' : `${qi + 1} / ${deck.length}`;
  $('pPts').textContent = mode === 'lookup' ? '' : `${total} 分`;
  $('qLbl').textContent = mode === 'lookup' ? '你覺得全台灣' : '全台灣姓';
  $('qName').textContent = s.name;
  $('qNote').textContent = s.note ? `（${s.note}）` : '';
  $('qTail').textContent = mode === 'lookup' ? '有多少人跟你同姓？' : '的人有多少？';
  $('revealCard').hidden = true; $('guessCard').hidden = false;
  $('pGo').textContent = '確認答案';
  setVal(10000);
}
function reveal(){
  if(revealed) return; revealed = true;
  const s = deck[qi], g = val, a = s.count, sc = scoreOf(g, a), err = Math.abs(g - a) / a * 100;
  if(mode === 'challenge'){ total += sc; results.push({name: s.name, g, a, sc}); }
  track('question_answered', {surname: s.name, guess: g, score: sc, mode});
  const extra = mode === 'lookup'
    ? `<div class="rgrid">${s.rank ? `<div class="rbox"><span>全國排名</span><b>第 ${s.rank} 名</b></div>` : s.compound_rank ? `<div class="rbox"><span>複姓排名</span><b>第 ${s.compound_rank} 名</b></div>` : ''}
       <div class="rbox"><span>佔全台人口</span><b>${pctOf(s) >= .01 ? pctOf(s).toFixed(2) : pctOf(s).toFixed(4)}%</b></div></div>` : '';
  $('revealCard').innerHTML = `<div class="confetti" id="conf"></div>
    <div class="rgrid"><div class="rbox answer"><span>正確答案</span><b id="ansNum">0</b><span>人</span></div>
      <div class="rbox"><span>你猜</span><b>${fmt(g)}</b></div><div class="rbox"><span>誤差</span><b>${err >= 1000 ? fmt(err) : err.toFixed(1)}%</b></div></div>
    ${extra}
    ${mode === 'challenge' ? `<div class="gain">+<span id="gainNum">0</span><small> 分</small></div><div class="bar"><i id="gainBar"></i></div>` : ''}
    <div class="quip">${quipOf(sc)}</div>`;
  $('revealCard').hidden = false; $('guessCard').hidden = true; $('revealCard').classList.remove('in'); void $('revealCard').offsetWidth; $('revealCard').classList.add('in');
  countUp($('ansNum'), a, 900);
  if($('gainNum')){ countUp($('gainNum'), sc, 700); requestAnimationFrame(() => $('gainBar').style.width = sc + '%'); }
  if(sc >= 80) confetti();
  $('pPts').textContent = mode === 'lookup' ? '' : `${total} 分`;
  $('pGo').textContent = mode === 'lookup' ? '換一個姓氏猜猜看' : qi === deck.length - 1 ? '看總分 →' : '下一題 →';
  if(mode === 'lookup') showLookupButtons();
}
function showLookupButtons(){
  const box = document.createElement('div'); box.className = 'btns hide-rec';
  box.innerHTML = '<button class="go alt" id="lkShare">分享結果</button><button class="go alt" data-go="challenge">挑戰 10 題模式</button>';
  $('revealCard').appendChild(box);
  $('lkShare').onclick = () => { const s = deck[0];
    shareText(`我猜全台灣有 ${fmt(val)} 人跟我同姓，誤差 ${(Math.abs(val - s.count) / s.count * 100).toFixed(0)}%！你猜得到你的姓有多少人嗎？`); };
}
function next(){
  if(!revealed){ reveal(); return; }
  if(mode === 'lookup'){ openLookup(); return; }
  if(qi < deck.length - 1){ qi++; openQ(); } else finish();
}
function countUp(el, to, ms){ const t0 = performance.now(); const f = t => { const k = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - k, 3); el.textContent = fmt(to * e); if(k < 1) requestAnimationFrame(f); }; requestAnimationFrame(f); }
function confetti(){ const c = $('conf'); if(!c) return; const cols = ['#9FD8B0','#F6A3B6','#A9D6F2','#f2b233'];
  c.innerHTML = Array.from({length: 28}, (_, i) => `<i style="left:${Math.random() * 100}%; background:${cols[i % 4]}; animation-delay:${Math.random() * .3}s"></i>`).join(''); }

$('gRange').addEventListener('input', e => setVal(posToVal(+e.target.value), true));
$('moreGames').addEventListener('click', () => track('more_games_click'));
$('gMinus').onclick = () => { if(!revealed) setVal(val - stepOf(val - 1)); };
$('gPlus').onclick = () => { if(!revealed) setVal(val + stepOf(val)); };
$('gInput').addEventListener('input', e => { const n = parseInt(e.target.value.replace(/[^\d]/g, ''), 10); if(n > 0) setVal(n); });
$('gInput').addEventListener('blur', () => { $('gInput').value = fmt(val); });
$('gInput').addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); $('gInput').blur(); next(); } });
$('pGo').onclick = next;
$('redoBtn').onclick = () => { if(mode === 'challenge' && revealed){ const r = results.pop(); if(r) total -= r.sc; } openQ(); };
$('quitBtn').onclick = () => show('home');

/* ============ 結算 ============ */
function finish(){
  show('final'); const t = titleOf(total);
  $('fScore').innerHTML = `0<small> / ${deck.length * 100}</small>`; countUp({set textContent(v){ $('fScore').innerHTML = `${v}<small> / ${deck.length * 100}</small>`; }}, total, 1000);
  $('fTitle').textContent = t; $('fLine').textContent = '你能超越我嗎？';
  $('fRecap').innerHTML = '<div style="border:0"><span>姓氏</span><span>你猜／答案</span><span>分數</span></div>' + results.map(r => `<div><b>${esc(r.name)}</b><span>${fmt(r.g)}／${fmt(r.a)}</span><span>${r.sc}</span></div>`).join('');
  track('quiz_complete', {score: total, title: t});
}
function shareText(text){
  const u = new URL(location.href); u.search = ''; u.hash = '';
  const full = `${text}\n${u}\n${IG_HANDLE}`; track('share_click');
  (async () => { try{ if(navigator.share){ await navigator.share({text: full}); return; } }catch(e){ if(e && e.name === 'AbortError') return; }
    try{ await navigator.clipboard.writeText(full); toast('已複製，貼給朋友吧！'); }catch(e){ toast('複製失敗，請截圖分享'); } })();
}
$('fShare').onclick = () => shareText(`我在「台灣姓氏人口挑戰」拿到 ${total} / ${deck.length * 100} 分，是「${titleOf(total)}」！你能超越我嗎？`);
$('fAgain').onclick = () => startChallenge();

/* 成績圖：1080×1920，只放分數，不放玩家輸入的資料 */
let imgBlob = null;
$('fImg').onclick = async () => {
  try{ await document.fonts.ready; }catch(e){}
  const W = 1080, H = 1920, c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
  const R = "'Huninn','Noto Sans TC',sans-serif", S = "'Noto Sans TC',sans-serif";
  const rr = (x, y, w, h, r) => { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); };
  g.fillStyle = '#FFF8ED'; g.fillRect(0, 0, W, H);
  [['#9FD8B0', 120, 260, 180], ['#A9D6F2', 960, 380, 140], ['#F6A3B6', 900, 1700, 200], ['#f2b233', 160, 1600, 90]].forEach(([col, x, y, r]) => { g.fillStyle = col; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); });
  g.fillStyle = '#252525'; rr(98, 488, 900, 980, 60); g.fill();
  g.fillStyle = '#F6A3B6'; rr(90, 480, 900, 980, 60); g.fill(); g.lineWidth = 8; g.strokeStyle = '#252525'; g.stroke();
  g.textAlign = 'center'; g.fillStyle = '#252525';
  g.font = `900 60px ${S}`; g.fillText('台灣姓氏人口挑戰', W / 2, 640);
  g.font = `900 300px ${S}`; g.fillText(String(total), W / 2, 960);
  g.font = `700 70px ${S}`; g.fillText(`/ ${deck.length * 100} 分`, W / 2, 1060);
  g.font = `400 84px ${R}`; const tw = g.measureText(titleOf(total)).width + 90;
  g.fillStyle = '#252525'; rr(W / 2 - tw / 2, 1130, tw, 130, 30); g.fill();
  g.fillStyle = '#FFF8ED'; g.fillText(titleOf(total), W / 2, 1222);
  g.fillStyle = '#252525'; g.font = `900 56px ${S}`; g.fillText('你能超越我嗎？', W / 2, 1370);
  g.font = `700 44px ${S}`; if(location.protocol !== 'file:') g.fillText(location.host + location.pathname.replace(/index\.html$/, ''), W / 2, 1620);
  g.font = `900 48px ${S}`; g.fillText(IG_HANDLE, W / 2, 1700);
  const url = c.toDataURL('image/png'); $('sheetImg').src = url; $('sheetDl').href = url;
  imgBlob = await new Promise(r => c.toBlob(r, 'image/png'));
  $('sheetShare').hidden = !(imgBlob && navigator.canShare && navigator.canShare({files: [new File([imgBlob], 's.png', {type: 'image/png'})]}));
  $('sheet').hidden = false; track('score_card');
};
$('sheetShare').onclick = async () => { try{ await navigator.share({files: [new File([imgBlob], 'surname-score.png', {type: 'image/png'})]}); }catch(e){} };
$('sheetClose').onclick = () => $('sheet').hidden = true;

/* ============ 查自己的姓氏 ============ */
function openLookup(){
  show('lookup'); $('lkMsg').textContent = ''; $('lkInput').value = '';
  $('lkSugg').innerHTML = D.surnames.slice().sort((a, b) => b.count - a.count).slice(0, 10).map(s => `<button data-s="${esc(s.name)}">${esc(s.name)}</button>`).join('')
    + ['歐陽','張簡','范姜'].map(n => `<button data-s="${n}">${n}</button>`).join('');
}
function findSurname(q){ q = (q || '').replace(/\s/g, ''); return BY[q] || null; }    // 完整比對：「歐陽」不會變成「歐」
function goLookup(){
  const q = $('lkInput').value.trim(); if(!q){ $('lkMsg').textContent = '先輸入一個姓氏'; return; }
  const s = findSurname(q);
  if(!s){ $('lkMsg').textContent = `「${q}」的人數這份資料還沒收錄（目前只收錄 ${D.surnames.length} 個有官方逐姓人數的姓氏）`; track('lookup_miss'); return; }
  startLookup(s);
}
$('lkGo').onclick = goLookup;
$('lkInput').addEventListener('keydown', e => { if(e.key === 'Enter') goLookup(); });
$('lkSugg').onclick = e => { const b = e.target.closest('[data-s]'); if(b){ $('lkInput').value = b.dataset.s; goLookup(); } };

/* ============ 排行榜 ============ */
let rkTab = 'all';
const TABS = [['all','全部'],['top10','前 10 大姓'],['compound','複姓'],['variant','異體字'],['rare','1 萬人以下']];
function renderRank(){
  $('rkTabs').innerHTML = TABS.map(([k, t]) => `<button class="chipbtn${k === rkTab ? ' on' : ''}" data-tab="${k}">${t}</button>`).join('');
  const q = $('rkInput').value.trim(), max = D.surnames[0].count;
  let list = D.surnames.slice().sort((a, b) => b.count - a.count);
  if(rkTab === 'top10') list = list.filter(s => s.rank);
  if(rkTab === 'compound') list = list.filter(s => s.tags.includes('compound'));
  if(rkTab === 'variant') list = list.filter(s => PAIRS.flat().includes(s.name));
  if(rkTab === 'rare') list = list.filter(s => s.count < 10000);
  if(q) list = list.filter(s => s.name === q || s.name.includes(q));
  $('rkList').innerHTML = list.length ? list.map(s => `<button class="row" data-s="${esc(s.name)}">
      <span class="rk">${s.rank ? s.rank : s.compound_rank ? '複' + s.compound_rank : '–'}</span>
      <span class="nm">${esc(s.name)}${s.note ? `<small>${esc(s.note)}</small>` : ''}</span><span class="ct">${fmt(s.count)} 人</span>
      <span class="barw"><i style="width:${Math.max(.6, Math.sqrt(s.count / max) * 100)}%"></i></span></button>`).join('')
    : `<div class="card note">找不到「${esc(q)}」。這份資料只收錄 ${D.surnames.length} 個有官方逐姓人數的姓氏。</div>`;
  $('rkVariants').innerHTML = `<h3 class="section-t">你以為很少見，其實很多人</h3>
    <p class="note">同一個姓的不同寫法，官方是分開統計的。猜猜哪個寫法比較多？</p>` +
    PAIRS.map(([a, b]) => { const A = BY[a], B = BY[b]; return `<div class="pair" style="margin-top:10px"><div><b>${a}</b><span>${fmt(A.count)}</span></div><div class="vs">VS</div><div><b>${b}</b><span>${fmt(B.count)}</span></div></div>`; }).join('');
}
$('rkTabs').onclick = e => { const b = e.target.closest('[data-tab]'); if(b){ rkTab = b.dataset.tab; renderRank(); } };
$('rkInput').addEventListener('input', renderRank);
$('rkList').onclick = e => { const b = e.target.closest('[data-s]'); if(b) startLookup(BY[b.dataset.s]); };

/* ============ 錄影模式 ============ */
let rec = false;
function setRec(on){ rec = on; document.body.classList.toggle('rec', on); $('recToggle').classList.toggle('on', on); }
$('recToggle').onclick = () => { $('recList').value = (localStorage.getItem('surname.recList') || ''); show('recset'); };
$('exitRec').onclick = () => setRec(false);
$('recStart').onclick = () => {
  const names = $('recList').value.split(/[\s,，、]+/).filter(Boolean), bad = names.filter(n => !BY[n]);
  if(!names.length){ $('recMsg').textContent = '先輸入姓氏'; return; }
  if(bad.length){ $('recMsg').textContent = `資料庫沒有：${bad.join('、')}`; return; }
  try{ localStorage.setItem('surname.recList', names.join(',')); }catch(e){}
  setRec(true); startChallenge(names.map(n => BY[n]));
};
$('recRandom').onclick = () => { setRec(true); startChallenge(); };

document.addEventListener('keydown', e => {
  if(e.target.tagName === 'TEXTAREA' || (e.target.tagName === 'INPUT' && e.target.type !== 'range')) return;
  const k = e.key, playing = !$('v-play').hidden;
  if(k === 'Escape' && rec){ setRec(false); return; }
  if((k === 'r' || k === 'R') && playing){ setRec(!rec); return; }
  if(!playing) return;
  if(k === 'Enter' || k === ' ' || k === 'ArrowRight'){ e.preventDefault(); next(); }
  else if(k === 'ArrowUp' && !revealed){ e.preventDefault(); setVal(val + stepOf(val)); }
  else if(k === 'ArrowDown' && !revealed){ e.preventDefault(); setVal(val - stepOf(val - 1)); }
});

/* ============ 網址：#rank 直接開排行榜、#lookup 開查姓氏 ============ */
function routeHash(){ if(!D) return; if(location.hash === '#rank'){ renderRank(); show('rank'); } else if(location.hash === '#lookup') openLookup(); }
window.addEventListener('hashchange', routeHash);

/* ============ 啟動 ============ */
loadData().then(d => {
  D = d; D.surnames.sort((a, b) => b.count - a.count); D.surnames.forEach(s => BY[s.name] = s);
  const src = `資料來源：<a href="${D.source.url}" target="_blank" rel="noopener">${D.source.publisher}《${D.source.title}》</a>，資料時間 ${D.source.data_date}，全國人口 ${fmt(D.source.total_population)} 人、共 ${fmt(D.source.total_surnames)} 個姓氏。目前收錄報告中有逐姓公布人數的 ${D.surnames.length} 個姓氏。`;
  $('srcNote').innerHTML = src; $('lkNote').innerHTML = src; $('rkNote').innerHTML = src;
  $('lkList').innerHTML = D.surnames.map(s => `<option value="${esc(s.name)}">`).join('');
  $('homeFacts').innerHTML = `<div class="fact"><b>${fmt(D.source.total_surnames)}</b><span>個姓氏</span></div><div class="fact"><b>${fmt(BY['陳'].count)}</b><span>姓陳的人</span></div>`;
  routeHash();
}).catch(() => { $('srcNote').textContent = '資料載入失敗，請重新整理'; toast('資料載入失敗'); });
</script>
</body>
</html>
