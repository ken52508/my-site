<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>順風 Kai 局｜短影音裡的挑戰，你也來玩</title>
<meta name="description" content="順風 Kai 局：一站收錄所有小遊戲挑戰，從台灣常識題開始，新挑戰先在 IG 公布。">
<meta property="og:type" content="website">
<meta property="og:title" content="順風 Kai 局｜短影音裡的挑戰，你也來玩">
<meta property="og:description" content="一站收錄所有小遊戲挑戰，從台灣常識題開始，新挑戰先在 IG 公布。">
<meta name="theme-color" content="#16130e">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%8E%AE</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-C77ELCKPVB"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-C77ELCKPVB');</script>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --page:#16130e;
  --board:#ffd23a;
  --ink:#17140f;
  --paper:#fffaf0;
  --soft:#a99d84;
  --round:'Huninn','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
}
html,body{margin:0;max-width:100%;overflow-x:hidden}
body{background:var(--page); color:var(--paper); font-family:var(--sans); -webkit-tap-highlight-color:transparent}
a{color:inherit}
button{font:inherit; color:inherit; cursor:pointer}
:focus-visible{outline:3px solid var(--board); outline-offset:3px}
.wrap{width:100%; max-width:1100px; margin:0 auto; padding-inline:max(16px, env(safe-area-inset-left,0px))}

.hero{padding-block:40px 28px; text-align:center}
.hero h1{font-family:var(--round); font-weight:400; font-size:clamp(2.2rem,8vw,3.4rem); margin:0 0 10px; line-height:1.1}
.hero p.tagline{font-size:1rem; color:#d9cfb8; margin:0 0 22px; font-weight:500}
.btn{display:inline-flex; align-items:center; gap:8px; border:3px solid var(--ink); border-radius:99px; padding:12px 24px;
  font-weight:900; font-size:.95rem; letter-spacing:.02em; text-decoration:none; background:var(--board); color:var(--ink);
  box-shadow:4px 4px 0 var(--ink); transition:transform .08s, box-shadow .08s}
.btn:hover{transform:translate(-2px,-2px); box-shadow:6px 6px 0 var(--ink)}
.btn:active{transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink)}
.btn.ghost{background:var(--paper)}

.games{padding-block:12px 36px}
.games h2{font-family:var(--round); font-weight:400; font-size:1.6rem; margin:0 0 18px; text-align:center}
.grid{display:grid; grid-template-columns:1fr; gap:18px}
@media (min-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (min-width:980px){.grid{grid-template-columns:repeat(3,1fr)}}

.card{position:relative; aspect-ratio:1/1; display:flex; flex-direction:column; justify-content:flex-start; gap:8px;
  background:var(--paper); color:var(--ink); border:3px solid var(--ink); border-radius:18px; padding:20px;
  box-shadow:6px 6px 0 var(--ink); text-decoration:none; overflow:hidden; transition:transform .1s, box-shadow .1s}
.card:hover{transform:translate(-3px,-3px); box-shadow:9px 9px 0 var(--ink)}
.card:active{transform:translate(2px,2px); box-shadow:3px 3px 0 var(--ink)}
.card .icon{font-size:2.6rem; line-height:1}
.card h3{font-family:var(--round); font-weight:400; font-size:1.4rem; margin:0; line-height:1.2}
.card .desc{font-size:.88rem; color:#4a4435; font-weight:500; line-height:1.4; flex:1; min-height:0}
.card .meta{font-size:.78rem; font-weight:700; color:#7a6420}
.card .tags{display:flex; flex-wrap:wrap; gap:6px; margin-top:auto}
.card .tag{font-size:.7rem; font-weight:700; border:2px solid var(--ink); border-radius:99px; padding:2px 10px}

.card.soon{opacity:.55; cursor:pointer}
.card.soon .badge{position:absolute; top:14px; right:-34px; transform:rotate(35deg); background:var(--ink); color:var(--board);
  font-size:.7rem; font-weight:900; padding:4px 40px; letter-spacing:.1em}

.promo{padding-block:34px 44px; text-align:center}
.promo .box{background:var(--board); color:var(--ink); border:3px solid var(--ink); border-radius:20px; box-shadow:6px 6px 0 var(--ink);
  padding:30px 22px; max-width:640px; margin:0 auto}
.promo p{font-family:var(--round); font-weight:400; font-size:1.3rem; margin:0 0 18px; line-height:1.3}

footer{padding-block:24px 40px; text-align:center; font-size:.8rem; color:var(--soft)}
footer a{text-decoration:underline; color:#d9cfb8}
</style>
</head>
<body>

<header class="hero wrap">
  <h1>順風 Kai 局</h1>
  <p class="tagline">短影音裡的挑戰，你也來玩</p>
  <a class="btn" id="igHeader" href="https://www.instagram.com/whatistruthqq/" target="_blank" rel="noopener">📷 追蹤 IG @whatistruthqq</a>
</header>

<main>
  <section class="games wrap">
    <h2>選一個挑戰</h2>
    <div class="grid" id="grid"></div>
  </section>

  <section class="promo wrap">
    <div class="box">
      <p>每週新挑戰都先在 IG 發，追蹤才不會錯過</p>
      <a class="btn ghost" id="igPromo" href="https://www.instagram.com/whatistruthqq/" target="_blank" rel="noopener">📷 追蹤 @whatistruthqq</a>
    </div>
  </section>
</main>

<footer class="wrap">
  <p><a id="igFooter" href="https://www.instagram.com/whatistruthqq/" target="_blank" rel="noopener">Instagram @whatistruthqq</a></p>
  <p>&copy; <span id="year"></span> 順風 Kai 局</p>
</footer>

<script>
/* ========== 遊戲清單：之後要新增遊戲，只要在這個陣列多加一筆資料，
   並在 games/ 底下建一個同名資料夾放該遊戲的 index.html 就好 ==========
   slug:   資料夾名稱，例如 'taiwan_quiz' 對應 games/taiwan_quiz/index.html
   status: 'live' 可以點進去玩；'soon' 顯示「即將推出」，點下去改連去 IG
*/
const GAMES = [
  { slug:'taiwan_quiz', title:'台灣人必答常識題', desc:'20 題台灣常識，你是觀光客還是台灣通？', meta:'20 題・約 3 分鐘', tags:['台灣','常識'], icon:'🏔️', status:'live' },
  { slug:'kpop_guess', title:'看童年照猜女團成員', desc:'小時候就這麼可愛？你能認出幾位？', meta:'10 題・約 2 分鐘', tags:['K-pop','猜猜看'], icon:'💖', status:'live' },
  { slug:'', title:'下一個挑戰', desc:'敬請期待，先追蹤 IG', meta:'', tags:[], icon:'❓', status:'soon' },
];

const IG_URL = 'https://www.instagram.com/whatistruthqq/';

function track(name, params){ try{ if(typeof window.gtag === 'function') window.gtag('event', name, params || {}); }catch(e){} }

document.getElementById('year').textContent = new Date().getFullYear();

const grid = document.getElementById('grid');
grid.innerHTML = GAMES.map(g => {
  const tags = g.tags.map(t => `<span class="tag">${t}</span>`).join('');
  const meta = g.meta ? `<div class="meta">${g.meta}</div>` : '';
  if(g.status === 'live'){
    return `<a class="card" href="${g.slug}/" data-slug="${g.slug}">
      <div class="icon">${g.icon}</div>
      <h3>${g.title}</h3>
      <div class="desc">${g.desc}</div>
      ${meta}
      <div class="tags">${tags}</div>
    </a>`;
  }
  return `<a class="card soon" href="${IG_URL}" target="_blank" rel="noopener" data-soon="1">
    <span class="badge">即將推出</span>
    <div class="icon">${g.icon}</div>
    <h3>${g.title}</h3>
    <div class="desc">${g.desc}</div>
    ${meta}
    <div class="tags">${tags}</div>
  </a>`;
}).join('');

grid.addEventListener('click', e => {
  const card = e.target.closest('.card');
  if(!card) return;
  if(card.dataset.soon){ track('ig_click', {location:'soon_card'}); }
  else{ track('game_click', {slug: card.dataset.slug}); }
});

document.getElementById('igHeader').addEventListener('click', () => track('ig_click', {location:'header'}));
document.getElementById('igPromo').addEventListener('click', () => track('ig_click', {location:'promo'}));
document.getElementById('igFooter').addEventListener('click', () => track('ig_click', {location:'footer'}));
</script>
</body>
</html>
