<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
:root{
  color-scheme:dark;
  --page:#16130e; --board:#ffd23a; --ink:#17140f; --paper:#fffaf0; --soft:#7a6420; --scale:1;
  --round:'Huninn','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
}
html,body{height:100%}
body{background:var(--page); color:var(--paper); font-family:var(--sans); overflow:hidden; padding-inline:16px}
button,input{font:inherit; color:inherit}
button{cursor:pointer}
.app{height:100%; display:grid; grid-template-rows:1fr auto; gap:12px; padding-block:14px}
.cell{container-type:size; min-height:0; display:grid; place-items:center}
.board{
  --u:calc(min(100cqw,100cqh) / 100 * var(--scale));
  position:relative; width:calc(min(100cqw,100cqh) * var(--scale)); aspect-ratio:1/1; max-width:100%;
  background:var(--board); color:var(--ink); border-radius:calc(var(--u)*3); overflow:hidden;
  padding:calc(var(--u)*4); display:flex; flex-direction:column; gap:calc(var(--u)*2.2); user-select:none}
.board::before{content:""; position:absolute; inset:0; pointer-events:none; opacity:.09;
  background-image:linear-gradient(var(--ink) 1px,transparent 1px),linear-gradient(90deg,var(--ink) 1px,transparent 1px);
  background-size:calc(var(--u)*5) calc(var(--u)*5)}
body.nogrid .board::before{display:none}
.board > *{position:relative}

.head{display:flex; align-items:center; justify-content:space-between; gap:calc(var(--u)*2)}
.pill{font-weight:900; font-size:calc(var(--u)*3.4); background:var(--ink); color:var(--board); padding:calc(var(--u)*.9) calc(var(--u)*2.8); border-radius:99px; letter-spacing:.06em}
.dots{display:flex; gap:calc(var(--u)*1)}
.dots i{width:calc(var(--u)*2); height:calc(var(--u)*2); border-radius:50%; border:calc(var(--u)*.45) solid var(--ink)}
.dots i.on{background:var(--ink)}

.stage{flex:1; min-height:0; display:grid; place-items:center}
.frame{position:relative; height:100%; aspect-ratio:1/1; max-width:100%; border:calc(var(--u)*.7) solid var(--ink); border-radius:calc(var(--u)*3);
  box-shadow:calc(var(--u)*1) calc(var(--u)*1) 0 var(--ink); overflow:hidden; background:var(--paper)}
.frame img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transition:transform .55s ease}
.zoom{position:absolute; right:calc(var(--u)*1.6); top:calc(var(--u)*1.6); background:var(--ink); color:var(--board); font-weight:900; font-size:calc(var(--u)*2.6);
  padding:calc(var(--u)*.5) calc(var(--u)*1.8); border-radius:99px}

.foot{display:grid; grid-template-columns:1fr auto auto; align-items:center; gap:calc(var(--u)*2.4); min-height:calc(var(--u)*11)}
.ans{display:flex; align-items:baseline; flex-wrap:wrap; gap:calc(var(--u)*1.6); min-width:0}
.ans .q{font-weight:900; font-size:calc(var(--u)*4.4)}
.ans .nm{font-family:var(--round); font-size:calc(var(--u)*7.4); line-height:1}
.ans .gp{font-weight:900; font-size:calc(var(--u)*3); background:var(--paper); border:calc(var(--u)*.45) solid var(--ink); border-radius:99px; padding:calc(var(--u)*.4) calc(var(--u)*1.8); align-self:center}
.back{border:calc(var(--u)*.5) solid var(--ink); border-radius:99px; background:transparent; color:var(--ink); font-weight:900; font-size:calc(var(--u)*3.8); width:calc(var(--u)*10); height:calc(var(--u)*10)}
.next{border:0; border-radius:99px; background:var(--ink); color:var(--board); font-weight:900; font-size:calc(var(--u)*3.6);
  padding:calc(var(--u)*2.2) calc(var(--u)*4); letter-spacing:.04em; white-space:nowrap}

.cover{position:absolute; inset:0; z-index:5; display:none; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:calc(var(--u)*3); padding:calc(var(--u)*7); background:var(--board)}
.board[data-mode="intro"] .cover.intro, .board[data-mode="end"] .cover.end{display:flex}
.cover h1{white-space:pre-line; font-family:var(--round); font-weight:400; font-size:calc(var(--u)*8.4); line-height:1.18; margin:0; text-wrap:balance}
.cover .sub{font-weight:900; font-size:calc(var(--u)*3.8)}
.tiny-nav{font-size:13px; color:#a99d84; margin-top:calc(var(--u)*2)}
.tiny-nav a{color:inherit; text-decoration:underline}
body.rec .tiny-nav{display:none}
.cover .big{font-size:calc(var(--u)*22); line-height:1}
.grid{display:grid; grid-template-columns:repeat(5,1fr); gap:calc(var(--u)*1.6); width:100%}
.grid div{position:relative; aspect-ratio:1/1; border:calc(var(--u)*.45) solid var(--ink); border-radius:calc(var(--u)*1.8); overflow:hidden; background:var(--paper)}
.grid img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.grid span{position:absolute; left:0; right:0; bottom:0; background:var(--ink); color:var(--board); font-weight:900; font-size:calc(var(--u)*2.1); padding:calc(var(--u)*.4) 0}
body.photo .frame{cursor:pointer; outline:calc(var(--u)*.6) dashed var(--ink); outline-offset:calc(var(--u)*.4)}

/* 工具列 */
.tools{display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:8px}
.tb{border:1px solid #3a3326; background:#221d15; color:#fffaf0; border-radius:99px; padding:8px 14px; font-size:13.5px}
.tb.on{background:var(--board); color:var(--ink); border-color:var(--board)}
.grp{display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border:1px solid #3a3326; border-radius:99px; background:#221d15; font-size:13px}
.grp input[type=color]{width:26px; height:22px; border:0; padding:0; background:none; cursor:pointer}
.grp input[type=range]{width:80px}
.sw{width:20px; height:20px; border-radius:50%; border:2px solid #3a3326; padding:0}
.keys{width:100%; text-align:center; font-size:12px; color:#a99d84; line-height:1.6}
body.rec .tools{display:none}
body.rec .app{grid-template-rows:1fr; padding-block:0; gap:0}
body.rec .board{border-radius:0}

/* 設定面板 */
.op-wrap{position:fixed; inset:0; z-index:45; background:rgba(0,0,0,.78); display:grid; place-items:center; padding:16px}
.op{width:min(760px,100%); max-height:90vh; overflow-y:auto; display:flex; flex-direction:column; gap:10px; background:#221d15; color:#fffaf0; border:1px solid #3a3326; border-radius:16px; padding:16px; font-size:14px}
.op h3{margin:6px 0 0; font-size:16px}
.op input{background:#2c261c; border:1px solid #3a3326; border-radius:8px; padding:6px 8px; min-width:0; width:100%}
.op .r2{display:grid; grid-template-columns:auto 1fr; gap:8px; align-items:center}
.op .card{display:grid; grid-template-columns:140px 1fr; gap:10px; border:1px solid #3a3326; border-radius:12px; padding:10px}
.op .th{position:relative; width:140px; aspect-ratio:1/1; border-radius:8px; overflow:hidden; cursor:crosshair; background:#000}
.op .th img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.op .th i{position:absolute; width:14px; height:14px; margin:-7px 0 0 -7px; border-radius:50%; border:3px solid #fff; background:#e5484d; box-shadow:0 0 0 2px #000; pointer-events:none}
.op .fs{display:flex; flex-direction:column; gap:6px}
.op .bar{display:flex; gap:6px; flex-wrap:wrap}
.op .bar button{border:1px solid #3a3326; background:#2c261c; border-radius:8px; padding:5px 10px}
.op small{color:#a99d84}
.op .row2{display:flex; flex-wrap:wrap; gap:8px; justify-content:flex-end; margin-top:6px}
.op .go{background:var(--board); color:#17140f; border:0; border-radius:99px; padding:9px 16px; font-weight:900}
.toast{position:fixed; left:50%; top:14px; transform:translateX(-50%); z-index:60; background:#221d15; color:#fffaf0; border:1px solid #3a3326; padding:8px 14px; border-radius:99px; font-size:13px; opacity:0; pointer-events:none; transition:opacity .25s}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.frame img{transition:none}}
</style>
</head>

<div class="app">
  <div class="cell">
    <div class="board" id="board" data-mode="intro">
      <div class="head"><div class="pill" id="qno">第 1 題</div><div class="dots" id="dots"></div></div>
      <div class="stage"><div class="frame" id="frame"><img id="photo" alt=""><div class="zoom" id="zoom"></div></div></div>
      <div class="foot"><div class="ans" id="ans"></div><button class="back" id="backBtn" title="上一步">←</button><button class="next" id="nextBtn">放大一點 →</button></div>

      <div class="cover intro"><h1 id="introTitle"></h1><div class="sub" id="introSub"></div>
        <div class="tiny-nav"><a id="moreGames" href="../">← 更多遊戲</a><span> · </span><a id="igBtn" href="https://www.instagram.com/whatistruthqq/" target="_blank" rel="noopener">追蹤 IG</a></div>
      </div>
      <div class="cover end"><h1 id="endHead" style="font-size:calc(var(--u)*6.6)"></h1><div class="grid" id="grid"></div><div class="sub" id="endTitle"></div></div>
    </div>
  </div>
  <div class="tools" id="tools">
    <button class="tb" id="recBtn">錄影模式</button>
    <span class="grp" id="swatches"><span>背景</span></span>

    <button class="tb" id="editBtn">改題目／焦點</button>
    <button class="tb" id="photoBtn">換照片</button>

  </div>
</div>

<div class="op-wrap" id="opWrap" hidden><div class="op">
  <h3>文字</h3>
  <div class="r2"><span>開場標題</span><input id="fIntro"></div>
  <div class="r2"><span>開場小字</span><input id="fIntroSub"></div>
  <div class="r2"><span>結尾標題</span><input id="fEndHead"></div>
  <div class="r2"><span>結尾問句</span><input id="fEnd"></div>
  <div class="r2"><span>放大倍率</span><input id="fZooms" placeholder="5, 3, 1.8"></div>

  <h3>題目 <small>（點縮圖＝設定放大的位置，紅點點在一隻眼睛或嘴巴正中間）</small></h3>
  <div id="list"></div>
  <div class="row2" style="justify-content:flex-start"><button class="tb" id="opAdd">＋ 加一題</button></div>
  <div class="row2"><button class="tb" id="opReset">恢復預設</button><button class="tb" id="opClose">取消</button><button class="go" id="opSave">儲存並重新開始</button></div>
</div></div>
<input type="file" id="file" accept="image/*" hidden>

  endHead: '你猜對幾個？', end: '留言告訴我你猜對幾個',

  items: DEFAULT_PHOTOS.map((d, i) => ({id:'d' + i, name:d.name, group:d.group, fx:d.fx, fy:d.fy})),
};
const DEF_IMG = Object.fromEntries(DEFAULT_PHOTOS.map((d, i) => ['d' + i, d.img]));

/* ============ 狀態 ============ */
const $ = id => document.getElementById(id);
function track(n, p){ try{ if(typeof gtag === 'function') gtag('event', n, p || {}); }catch(e){} }
const board = $('board');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const X = { get(k){ try{ return JSON.parse(localStorage.getItem('idolzoom.' + k)); }catch(e){ return null; } },
  set(k, v){ try{ localStorage.setItem('idolzoom.' + k, JSON.stringify(v)); return true; }catch(e){ return false; } } };
let CFG = X.get('cfg') || JSON.parse(JSON.stringify(DEFAULT));
const photos = X.get('photos') || {};
const imgOf = it => photos[it.id] || DEF_IMG[it.id] || '';
let random = X.get('random') === true;
let deck = [], qi = -1, st = 0;   // qi -1 開場；deck.length 結尾；st = 第幾段（最後一段是揭曉）

function makeDeck(){
  deck = CFG.items.map((_, i) => i);
  if(random) for(let i = deck.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [deck[i], deck[j]] = [deck[j], deck[i]]; }
}
const lastSt = () => CFG.zooms.length;   // 0..zooms.length-1 放大，zooms.length = 揭曉

function render(){
  const n = deck.length;
  board.dataset.mode = qi < 0 ? 'intro' : qi >= n ? 'end' : 'play';
  $('introTitle').textContent = CFG.intro; $('introSub').textContent = CFG.introSub;
  $('endHead').textContent = CFG.endHead; $('endTitle').textContent = CFG.end;
  if(qi >= n){
    $('grid').style.gridTemplateColumns = `repeat(${Math.min(5, Math.max(1, n))}, 1fr)`;
    $('grid').innerHTML = deck.map(i => { const it = CFG.items[i]; return `<div><img src="${imgOf(it)}" alt=""><span>${esc(it.name)}</span></div>`; }).join('');
    return;
  }
  if(qi < 0) return;
  const it = CFG.items[deck[qi]];
  $('qno').textContent = `第 ${qi + 1} 題`;
  $('dots').innerHTML = deck.map((_, i) => `<i class="${i <= qi ? 'on' : ''}"></i>`).join('');
  const img = $('photo');
  if(img.dataset.src !== imgOf(it)){ img.style.transition = 'none'; img.src = imgOf(it); img.dataset.src = imgOf(it); }
  const z = st < lastSt() ? CFG.zooms[st] : 1;
  // 讓焦點（眼睛或嘴巴）在框框正中間，邊緣不露白
  const off = f => Math.min(0, Math.max(1 - z, .5 - f * z)) * 100;
  img.style.transformOrigin = '0 0';
  img.style.transform = `translate(${off(it.fx)}%, ${off(it.fy)}%) scale(${z})`;
  void img.offsetWidth; img.style.transition = '';
  $('zoom').textContent = st < lastSt() ? `放大 ${z} 倍` : '完整照片';
  const done = st >= lastSt();
  $('ans').innerHTML = done ? `<span class="nm">${esc(it.name)}</span>${it.group ? `<span class="gp">${esc(it.group)}</span>` : ''}` : `<span class="q">猜猜她是誰？</span>`;
  $('nextBtn').textContent = !done ? (st === lastSt() - 1 ? '揭曉 →' : '縮小一點 →') : qi === n - 1 ? '看結尾 →' : '下一題 →';
}
function go(){
  const n = deck.length;
  if(qi < 0){ track('quiz_start'); qi = 0; st = 0; $('photo').dataset.src = ''; return render(); }
  if(qi >= n) return;
  if(st < lastSt()){ st++; if(st === lastSt()) track('question_answered', {item: deck[qi]}); return render(); }
  qi++; st = 0; if(qi >= n) track('quiz_complete'); render();
}
function back(){
  if(qi < 0) return;
  if(qi >= deck.length){ qi = deck.length - 1; st = lastSt(); return render(); }
  if(st > 0){ st--; return render(); }
  if(qi > 0){ qi--; st = lastSt(); } else qi = -1;
  render();
}
function restart(){ makeDeck(); qi = -1; st = 0; render(); }
$('nextBtn').onclick = go;
$('backBtn').onclick = back;
$('restartBtn').onclick = restart;
board.addEventListener('click', e => { if(document.body.classList.contains('photo')) return; if(e.target.closest('.next, .back')) return; go(); });

/* ============ 工具列 ============ */
const root = document.documentElement.style;
const THEMES = ['#16130e','#0b0b0c','#2b2b30','#f3f1ea','#10291e','#0f1d33','#291838'];
$('swatches').insertAdjacentHTML('beforeend', THEMES.map(c => `<button class="sw" style="background:${c}" data-c="${c}"></button>`).join('') + '<input type="color" id="pagePick">');
function setPage(c){ root.setProperty('--page', c); $('pagePick').value = c; X.set('page', c); }
function setBoard(c){ root.setProperty('--board', c); $('boardPick').value = c; X.set('board', c); }
function setScale(v){ root.setProperty('--scale', v / 100); $('sizePick').value = v; $('sizeVal').textContent = v + '%'; X.set('size', v); }
function setGrid(on){ document.body.classList.toggle('nogrid', !on); $('gridBtn').classList.toggle('on', on); X.set('grid', on); }
function setOrder(r){ random = r; $('orderBtn').textContent = r ? '隨機順序' : '固定順序'; $('orderBtn').classList.toggle('on', r); X.set('random', r); }
$('swatches').onclick = e => { const b = e.target.closest('.sw'); if(b) setPage(b.dataset.c); };
$('pagePick').oninput = e => setPage(e.target.value);
$('boardPick').oninput = e => setBoard(e.target.value);
$('sizePick').oninput = e => setScale(+e.target.value);
$('gridBtn').onclick = () => setGrid(document.body.classList.contains('nogrid'));
$('orderBtn').onclick = () => { setOrder(!random); restart(); toast(random ? '隨機順序（每次重新開始都會洗牌）' : '固定順序'); };
setPage(X.get('page') || THEMES[0]); setBoard(X.get('board') || '#ffd23a'); setScale(X.get('size') || 100); setGrid(X.get('grid') !== false); setOrder(random);
let rec = false;
function setRec(on){ rec = on; document.body.classList.toggle('rec', on); $('recBtn').classList.toggle('on', on); if(on) toast('錄影模式：點卡片下一步，Esc 離開'); }
$('recBtn').onclick = () => setRec(!rec);
$('moreGames').addEventListener('click', () => track('more_games_click'));
$('igBtn').addEventListener('click', () => track('ig_click', {location:'intro'}));

/* 讀圖：縮到 1000px 以內 */
function readImage(f, cb){
  const r = new FileReader(), im = new Image();
  r.onload = () => { im.onload = () => { const k = Math.min(1, 1000 / Math.max(im.width, im.height)), c = document.createElement('canvas');
    c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    cb(c.toDataURL('image/jpeg', .88)); }; im.src = r.result; };
  r.readAsDataURL(f);
}
let fileTarget = null;   // 換照片的題目 id
function pickFor(id){ fileTarget = id; $('file').value = ''; $('file').click(); }
$('file').onchange = () => { const f = $('file').files[0]; if(!f || !fileTarget) return;
  readImage(f, url => { photos[fileTarget] = url; const ok = X.set('photos', photos); toast(ok ? '已換照片，重新整理也會留著' : '已換照片（空間不夠，關掉就會還原）');
    $('photo').dataset.src = ''; render(); if(!$('opWrap').hidden) drawOp(); }); };

/* 換照片模式：點中間照片 */
$('photoBtn').onclick = () => { const on = !document.body.classList.contains('photo'); document.body.classList.toggle('photo', on); $('photoBtn').classList.toggle('on', on);
  toast(on ? '點中間的照片換成你的；右鍵還原' : '結束換照片'); };
$('frame').addEventListener('click', e => { if(!document.body.classList.contains('photo') || qi < 0 || qi >= deck.length) return; e.stopPropagation(); pickFor(CFG.items[deck[qi]].id); });
$('frame').addEventListener('contextmenu', e => { if(!document.body.classList.contains('photo') || qi < 0 || qi >= deck.length) return; e.preventDefault();
  delete photos[CFG.items[deck[qi]].id]; X.set('photos', photos); $('photo').dataset.src = ''; render(); toast('已還原'); });

/* 改題目／焦點 */
let draft = null, uid = Date.now();
function drawOp(){
  $('fIntro').value = draft.intro; $('fIntroSub').value = draft.introSub; $('fEndHead').value = draft.endHead; $('fEnd').value = draft.end; $('fZooms').value = draft.zooms.join(', ');
  $('list').innerHTML = draft.items.map((it, i) => `<div class="card"><div class="th" data-th="${i}">${imgOf(it) ? `<img src="${imgOf(it)}" alt="">` : ''}<i style="left:${it.fx * 100}%;top:${it.fy * 100}%"></i></div>
    <div class="fs"><small>第 ${i + 1} 題</small><input data-f="name" data-i="${i}" value="${esc(it.name)}" placeholder="名字"><input data-f="group" data-i="${i}" value="${esc(it.group)}" placeholder="團名">
    <div class="bar"><button data-pic="${i}">換照片</button><button data-mv="${i}" data-d="-1">▲</button><button data-mv="${i}" data-d="1">▼</button><button data-del="${i}">✕ 刪除</button></div></div></div>`).join('');
}
$('editBtn').onclick = () => { draft = JSON.parse(JSON.stringify(CFG)); drawOp(); $('opWrap').hidden = false; };
$('opWrap').addEventListener('input', e => { const t = e.target;
  if(t.dataset.f){ draft.items[+t.dataset.i][t.dataset.f] = t.value; return; }
  const m = {fIntro:'intro', fIntroSub:'introSub', fEndHead:'endHead', fEnd:'end'}[t.id]; if(m) draft[m] = t.value;
  if(t.id === 'fZooms'){ const z = t.value.split(/[,，\s]+/).map(Number).filter(v => v >= 1); if(z.length) draft.zooms = z; } });
$('opWrap').addEventListener('click', e => { const t = e.target;
  const th = t.closest('[data-th]');
  if(th){ const r = th.getBoundingClientRect(), it = draft.items[+th.dataset.th];
    it.fx = Math.round((e.clientX - r.left) / r.width * 100) / 100; it.fy = Math.round((e.clientY - r.top) / r.height * 100) / 100;
    th.querySelector('i').style.left = it.fx * 100 + '%'; th.querySelector('i').style.top = it.fy * 100 + '%'; return; }
  if(t.id === 'opAdd'){ draft.items.push({id:'u' + (uid++), name:'新成員', group:'', fx:.5, fy:.4}); drawOp(); }
  if(t.dataset.pic !== undefined) pickFor(draft.items[+t.dataset.pic].id);
  if(t.dataset.del !== undefined){ draft.items.splice(+t.dataset.del, 1); drawOp(); }
  if(t.dataset.mv !== undefined){ const L = draft.items, i = +t.dataset.mv, j = i + +t.dataset.d; if(j >= 0 && j < L.length){ [L[i], L[j]] = [L[j], L[i]]; drawOp(); } } });
$('opClose').onclick = () => { $('opWrap').hidden = true; };
$('opReset').onclick = () => { draft = JSON.parse(JSON.stringify(DEFAULT)); drawOp(); };
$('opSave').onclick = () => { CFG = draft; X.set('cfg', CFG); $('opWrap').hidden = true; restart(); toast('已儲存'); };

document.addEventListener('keydown', e => {
  if(!$('opWrap').hidden){ if(e.key === 'Escape') $('opWrap').hidden = true; return; }
  const k = e.key.toLowerCase();
  if(e.code === 'Space' || k === 'enter' || k === 'arrowright'){ e.preventDefault(); go(); }
  else if(k === 'backspace' || k === 'arrowleft'){ e.preventDefault(); back(); }
  else if(k === 'r') setRec(!rec);
  else if(k === 'escape' && rec) setRec(false);
});
document.querySelectorAll('button').forEach(b => b.addEventListener('keydown', e => { if(e.code === 'Space') e.preventDefault(); }));
let tt; function toast(m){ const el = $('toast'); el.textContent = m; el.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('show'), 2200); }
restart();
</script>
</body>
</html>
