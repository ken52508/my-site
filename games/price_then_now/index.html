<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
:root{
  color-scheme:dark;
  --page:#16130e; --board:#ffd23a; --ink:#17140f; --paper:#fffaf0; --soft:#7a6420;
  --ok:#1f9d55; --bad:#e5484d; --scale:1;
  --round:'Huninn','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
}
html,body{height:100%}
body{background:var(--page); color:var(--paper); font-family:var(--sans); overflow:hidden; padding-inline:16px}
button,input{font:inherit; color:inherit}
button{cursor:pointer}
.app{height:100%; display:grid; grid-template-rows:1fr auto; gap:12px; padding-block:14px}
.cell{container-type:size; min-height:0; display:grid; place-items:center}
.board{
  --u:calc(min(100cqw,100cqh) / 100 * var(--scale));
  position:relative; width:calc(min(100cqw,100cqh) * var(--scale)); aspect-ratio:1/1; max-width:100%;
  background:var(--board); color:var(--ink); border-radius:calc(var(--u)*3); overflow:hidden;
  padding:calc(var(--u)*4.5); display:flex; flex-direction:column; gap:calc(var(--u)*2.4); user-select:none}
.board::before{content:""; position:absolute; inset:0; pointer-events:none; opacity:.09;
  background-image:linear-gradient(var(--ink) 1px,transparent 1px),linear-gradient(90deg,var(--ink) 1px,transparent 1px);
  background-size:calc(var(--u)*5) calc(var(--u)*5)}
body.nogrid .board::before{display:none}
.board > *{position:relative}

.head{display:flex; align-items:center; justify-content:space-between; gap:calc(var(--u)*2)}
.pill{font-weight:900; font-size:calc(var(--u)*3.4); background:var(--ink); color:var(--board); padding:calc(var(--u)*.9) calc(var(--u)*2.8); border-radius:99px; letter-spacing:.06em}
.dots{display:flex; gap:calc(var(--u)*1.1)}
.dots i{width:calc(var(--u)*2.2); height:calc(var(--u)*2.2); border-radius:50%; border:calc(var(--u)*.45) solid var(--ink)}
.dots i.on{background:var(--ink)}

.top{display:grid; grid-template-columns:calc(var(--u)*29) 1fr; gap:calc(var(--u)*3.4); align-items:center; flex:1; min-height:0}
.pic{position:relative; aspect-ratio:1/1; width:100%; background:var(--paper); border:calc(var(--u)*.6) solid var(--ink); border-radius:calc(var(--u)*3);
  box-shadow:calc(var(--u)*.9) calc(var(--u)*.9) 0 var(--ink); overflow:hidden}
.pic img, .pic svg{position:absolute; inset:6%; width:88%; height:88%; object-fit:contain}
.pic.pop{animation:pop .5s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{0%{transform:scale(.6) rotate(-8deg); opacity:0}100%{transform:none}}
.info{display:flex; flex-direction:column; gap:calc(var(--u)*1.4); min-width:0}
.name{font-family:var(--round); font-size:calc(var(--u)*6.6); line-height:1.15; margin:0; text-wrap:balance}
.then{display:inline-flex; flex-direction:column; align-self:flex-start; background:var(--paper); border:calc(var(--u)*.5) solid var(--ink); border-radius:calc(var(--u)*2.2);
  padding:calc(var(--u)*1) calc(var(--u)*2.6); box-shadow:calc(var(--u)*.6) calc(var(--u)*.6) 0 var(--ink)}
.then span{font-weight:900; font-size:calc(var(--u)*2.7); color:var(--soft)}
.then b{font-family:var(--round); font-weight:400; font-size:calc(var(--u)*6.4); line-height:1.05}
.q{font-weight:900; font-size:calc(var(--u)*4.2)}

/* 猜的數字 / 揭曉 */
.mid{display:grid; grid-template-columns:1fr 1fr; gap:calc(var(--u)*2.4)}
.box{background:var(--paper); border:calc(var(--u)*.6) solid var(--ink); border-radius:calc(var(--u)*2.4); box-shadow:calc(var(--u)*.8) calc(var(--u)*.8) 0 var(--ink);
  padding:calc(var(--u)*1.2) calc(var(--u)*2.4); display:flex; flex-direction:column; justify-content:center; min-height:calc(var(--u)*15)}
.box span{font-weight:900; font-size:calc(var(--u)*2.8)}
.box b{font-family:var(--round); font-weight:400; font-size:calc(var(--u)*9); line-height:1; font-variant-numeric:tabular-nums}
.box small{font-weight:700; font-size:calc(var(--u)*2.4); color:var(--soft); margin-top:calc(var(--u)*.4)}
.ans{background:var(--ink); color:var(--board)}
.ans span, .ans small{color:var(--board)}
.ans.wait b{opacity:.35}
.ans.done{animation:bump .4s}
@keyframes bump{40%{transform:scale(1.07)}}

/* 滾輪 */
.track{position:relative; height:calc(var(--u)*8); margin:calc(var(--u)*3.4) calc(var(--u)*2) calc(var(--u)*3); touch-action:none; cursor:pointer}
.rail{position:absolute; left:0; right:0; top:50%; height:calc(var(--u)*2.6); transform:translateY(-50%); border-radius:99px; background:var(--paper); border:calc(var(--u)*.5) solid var(--ink); overflow:hidden}
.fill{position:absolute; left:0; top:0; bottom:0; background:var(--ink); opacity:.22}
.mk{position:absolute; top:50%; transform:translate(-50%,-50%); pointer-events:none}
.mk.line{width:0; height:calc(var(--u)*9); border-left:calc(var(--u)*.55) dashed var(--bad)}
.mk.line em{position:absolute; bottom:100%; left:50%; transform:translateX(-50%); white-space:nowrap; font-style:normal; font-weight:900; font-size:calc(var(--u)*2.3); color:var(--bad)}
.mk.old{width:calc(var(--u)*.6); height:calc(var(--u)*4.6); background:var(--soft); border-radius:99px}
.mk.old em{position:absolute; top:calc(100% + var(--u)*.4); left:50%; transform:translateX(-50%); white-space:nowrap; font-style:normal; font-weight:900; font-size:calc(var(--u)*2.2); color:var(--soft)}
.thumb{position:absolute; top:50%; width:calc(var(--u)*7); height:calc(var(--u)*7); transform:translate(-50%,-50%); border-radius:50%; background:var(--paper);
  border:calc(var(--u)*.6) solid var(--ink); box-shadow:calc(var(--u)*.5) calc(var(--u)*.5) 0 var(--ink); pointer-events:none; display:grid; place-items:center; font-weight:900; font-size:calc(var(--u)*2.2)}
.flag{position:absolute; top:50%; transform:translate(-50%,-50%); pointer-events:none; width:calc(var(--u)*7); height:calc(var(--u)*7); border-radius:50%; background:var(--ink); color:var(--board);
  display:grid; place-items:center; font-weight:900; font-size:calc(var(--u)*2.2); border:calc(var(--u)*.6) solid var(--ink)}
.ends{position:absolute; top:calc(100% + var(--u)*.2); left:0; right:0; display:flex; justify-content:space-between; font-weight:700; font-size:calc(var(--u)*2); color:var(--soft); pointer-events:none}

.foot{display:grid; grid-template-columns:1fr auto auto; align-items:center; gap:calc(var(--u)*3); min-height:calc(var(--u)*10)}
.say{font-weight:700; font-size:calc(var(--u)*3.2); line-height:1.4}
.say b{font-family:var(--round); font-weight:400; font-size:1.25em}
.say .up{color:var(--bad)} .say .same{color:var(--ok)}
.tag{display:inline-block; margin-left:calc(var(--u)*1); padding:calc(var(--u)*.3) calc(var(--u)*1.6); border-radius:99px; font-weight:900; font-size:calc(var(--u)*2.6); border:calc(var(--u)*.4) solid var(--ink); vertical-align:middle}
.tag.in{background:#c9f1d6} .tag.out{background:var(--bad); color:#fff}
.back{border:calc(var(--u)*.5) solid var(--ink); border-radius:99px; background:transparent; color:var(--ink); font-weight:900; font-size:calc(var(--u)*3.8); width:calc(var(--u)*10); height:calc(var(--u)*10)}
.next{border:0; border-radius:99px; background:var(--ink); color:var(--board); font-weight:900; font-size:calc(var(--u)*3.8);
  padding:calc(var(--u)*2.2) calc(var(--u)*4.4); letter-spacing:.06em; white-space:nowrap}

/* 開場、結尾 */
.cover{position:absolute; inset:0; z-index:5; display:none; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:calc(var(--u)*2.6); padding:calc(var(--u)*6); background:var(--board)}
.board[data-mode="intro"] .cover.intro, .board[data-mode="end"] .cover.end{display:flex}
.cover .bill{position:relative; width:calc(var(--u)*42); aspect-ratio:1/1; animation:float 2.4s ease-in-out infinite}
.cover .bill img, .cover .bill svg{position:absolute; inset:0; width:100%; height:100%; object-fit:contain}
.cover h1{white-space:pre-line; font-family:var(--round); font-weight:400; font-size:calc(var(--u)*8.4); line-height:1.15; margin:0; text-wrap:balance}
.cover .sub{font-weight:900; font-size:calc(var(--u)*3.8)}
.tiny-nav{font-size:13px; color:#a99d84; margin-top:calc(var(--u)*2)}
.tiny-nav a{color:inherit; text-decoration:underline}
body.rec .tiny-nav{display:none}
@keyframes float{50%{transform:translateY(calc(var(--u)*-2.2)) rotate(-3deg)}}
.sum{width:100%; display:flex; flex-direction:column; gap:calc(var(--u)*1.3)}
.sum > div{display:grid; grid-template-columns:calc(var(--u)*9) 1fr auto auto; align-items:center; gap:calc(var(--u)*2); background:var(--paper); border:calc(var(--u)*.5) solid var(--ink);
  border-radius:calc(var(--u)*2); padding:calc(var(--u)*.7) calc(var(--u)*2); text-align:left; }
.sum .im{position:relative; width:calc(var(--u)*9); aspect-ratio:1/1}
.sum .im img, .sum .im svg{position:absolute; inset:0; width:100%; height:100%; object-fit:contain}
.sum span{font-weight:900; font-size:calc(var(--u)*3.2)}
.sum em{font-style:normal; font-weight:700; font-size:calc(var(--u)*3); color:var(--soft); white-space:nowrap}
.sum b{font-family:var(--round); font-weight:400; font-size:calc(var(--u)*4.2); white-space:nowrap}
.sum b.up{color:var(--bad)} .sum b.same{color:var(--ok)}
body.photo [data-slot]{cursor:pointer; outline:calc(var(--u)*.5) dashed var(--ink); outline-offset:calc(var(--u)*.3)}

/* 工具列 */
.tools{display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:8px}
.tb{border:1px solid #3a3326; background:#221d15; color:#fffaf0; border-radius:99px; padding:8px 14px; font-size:13.5px}
.tb.on{background:var(--board); color:var(--ink); border-color:var(--board)}
.grp{display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border:1px solid #3a3326; border-radius:99px; background:#221d15; font-size:13px}
.grp input[type=color]{width:26px; height:22px; border:0; padding:0; background:none; cursor:pointer}
.grp input[type=range]{width:80px}
.sw{width:20px; height:20px; border-radius:50%; border:2px solid #3a3326; padding:0}
.keys{width:100%; text-align:center; font-size:12px; color:#a99d84; line-height:1.6}
body.rec .tools{display:none}
body.rec .app{grid-template-rows:1fr; padding-block:0; gap:0}
body.rec .board{border-radius:0}

/* 設定面板 */
.op-wrap{position:fixed; inset:0; z-index:45; background:rgba(0,0,0,.78); display:grid; place-items:center; padding:16px}
.op{width:min(760px,100%); max-height:90vh; overflow-y:auto; display:flex; flex-direction:column; gap:10px; background:#221d15; color:#fffaf0; border:1px solid #3a3326; border-radius:16px; padding:16px; font-size:14px}
.op h3{margin:6px 0 0; font-size:16px}
.op input{background:#2c261c; border:1px solid #3a3326; border-radius:8px; padding:6px 8px; min-width:0; width:100%}
.op .card{border:1px solid #3a3326; border-radius:12px; padding:10px; display:grid; gap:6px}
.op .g{display:grid; grid-template-columns:repeat(4,1fr); gap:6px}
.op label{display:grid; gap:3px; font-size:12px; color:#a99d84}
.op .bar{display:flex; gap:6px; justify-content:flex-end}
.op .bar button{border:1px solid #3a3326; background:#2c261c; border-radius:8px; width:32px; height:30px}
.op .r2{display:grid; grid-template-columns:auto 1fr; gap:8px; align-items:center}
.op .row2{display:flex; flex-wrap:wrap; gap:8px; justify-content:flex-end; margin-top:6px}
.op .go{background:var(--board); color:#17140f; border:0; border-radius:99px; padding:9px 16px; font-weight:900}
.op small{color:#a99d84}
.toast{position:fixed; left:50%; top:14px; transform:translateX(-50%); z-index:60; background:#221d15; color:#fffaf0; border:1px solid #3a3326; padding:8px 14px; border-radius:99px; font-size:13px; opacity:0; pointer-events:none; transition:opacity .25s}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="cell">
    <div class="board" id="board" data-mode="intro">
      <div class="head"><div class="pill" id="qno">第 1 題</div><div class="dots" id="dots"></div></div>
      <div class="top">
        <div class="pic" id="pic"></div>
        <div class="info">
          <p class="name" id="name"></p>
          <div class="then"><span id="oldLabel"></span><b id="oldPrice"></b></div>
          <div class="q" id="ask"></div>
        </div>
      </div>
      <div class="mid">
        <div class="box"><span>你猜</span><b id="guess">$0</b><small id="guessSub">拖滾輪</small></div>
        <div class="box ans wait" id="ansBox"><span id="nowLabel">現在</span><b id="now">$?</b><small id="diff">　</small></div>
      </div>
      <div class="track" id="track">
        <div class="rail"><div class="fill" id="fill"></div></div>
        <div class="mk old" id="oldMk"><em>以前</em></div>
        <div class="flag" id="flag" hidden>現在</div>
        <div class="thumb" id="thumb">猜</div>
        <div class="ends"><span>$0</span><span id="maxLbl"></span></div>
      </div>
      <div class="foot"><div class="say" id="say"></div><button class="back" id="backBtn" title="上一題">←</button><button class="next" id="nextBtn">揭曉 →</button></div>

      <div class="cover intro"><div class="bill" data-slot="bill" id="billIm"></div><h1 id="introTitle"></h1><div class="sub" id="introSub"></div>
        <div class="tiny-nav"><a id="moreGames" href="../">← 更多遊戲</a><span> · </span><a id="igBtn" href="https://www.instagram.com/whatistruthqq/" target="_blank" rel="noopener">追蹤 IG</a></div>
      </div>
      <div class="cover end"><h1 id="endHead" style="font-size:calc(var(--u)*6.6)"></h1><div class="sum" id="sum"></div><div class="sub" id="endTitle"></div></div>
    </div>
  </div>
  <div class="tools" id="tools">
    <button class="tb" id="recBtn">錄影模式</button>
    <span class="grp" id="swatches"><span>背景</span></span>
    <span class="grp"><span>卡片</span><input type="color" id="boardPick"></span>
    <span class="grp"><span>大小</span><input type="range" id="sizePick" min="50" max="100" value="100"><span id="sizeVal">100%</span></span>
    <button class="tb on" id="gridBtn">格線</button>
    <button class="tb" id="editBtn">改品項和價格</button>
    <button class="tb" id="photoBtn">換照片</button>
    <button class="tb" id="restartBtn">重新開始</button>
    <div class="keys">滑鼠：拖滾輪猜價格，點卡片任何地方＝揭曉／下一題，← 按鈕回上一題 · 鍵盤也可以：←／→ 調價格、空白鍵下一步、Backspace 上一題 · R 錄影模式 · Esc 離開<br>換照片：按下後點開場鈔票或品項圖，選 GPT 生的圖；右鍵還原</div>
  </div>
</div>

<div class="op-wrap" id="opWrap" hidden><div class="op">
  <h3>文字</h3>
  <div class="r2"><span>開場標題</span><input id="fIntro"></div>
  <div class="r2"><span>開場小字</span><input id="fIntroSub"></div>
  <div class="r2"><span>結尾標題</span><input id="fEndHead"></div>
  <div class="r2"><span>結尾問句</span><input id="fEnd"></div>
  <h3>品項 <small>（滾輪最大值：滾輪最右邊是幾元；超過 100 才會出現 100 元線）</small></h3>
  <div id="list"></div>
  <div class="row2" style="justify-content:flex-start"><button class="tb" id="opAdd">＋ 加一題</button></div>
  <div class="row2"><button class="tb" id="opReset">恢復預設</button><button class="tb" id="opClose">取消</button><button class="go" id="opSave">儲存並重新開始</button></div>
</div></div>
<input type="file" id="file" accept="image/*" hidden>
<div class="toast" id="toast"></div>

<script>
/* ============ 預設內容（都可以在「改品項和價格」裡改） ============ */
const DEFAULT = {
  intro: '這些年，\n漲價漲了多少？', introSub: '看以前的價格，猜猜現在多少',
  endHead: '這些年漲了多少', end: '你覺得哪個漲最誇張？留言告訴我',
  items: [
    {key:'egg',  name:'超商茶葉蛋',     oldLabel:'2015 年漲價前',     old:8,   nowLabel:'全家 2022 年底起',   now:13,  max:30,  note:''},
    {key:'mac',  name:'麥當勞大麥克',   oldLabel:'2000 年',           old:70,  nowLabel:'2026 年',           now:78,  max:150, note:'2016 年還一度降到 69 元'},
    {key:'ramen',name:'一蘭拉麵',       oldLabel:'2017 年來台開幕',   old:288, nowLabel:'2024 年 4 月起',     now:310, max:500, note:'天然豚骨拉麵'},
    {key:'tv',   name:'Netflix 高級方案',oldLabel:'2016 年來台（每月）',old:390, nowLabel:'2024 年 11 月起（每月）', now:460, max:600, note:''},
    {key:'xlb',  name:'鼎泰豐小籠包',   oldLabel:'2018 年 6 月前（10 顆）', old:210, nowLabel:'2026 年 6 月起（10 顆）', now:290, max:500, note:'2018、2024、2026 漲了三次'},
  ],
};

/* ============ Q 版預設插圖（之後用「換照片」換成 GPT 的圖） ============ */
const C = {ink:'#17140f', y:'#ffd23a', p:'#fffaf0', r:'#e5484d', g:'#2f9e5b', br:'#8a5a2b', pk:'#f6a3b6', o:'#f08a24', wood:'#c98a4b', egg:'#9a6b3f', bun:'#e9a24a', lb:'#a9d6f2', gr:'#9aa3ad'};
const S = `stroke="${C.ink}" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"`;
const face = (x, y, k = 1, sad) => `<circle cx="${x - 8*k}" cy="${y}" r="${2.4*k}" fill="${C.ink}"/><circle cx="${x + 8*k}" cy="${y}" r="${2.4*k}" fill="${C.ink}"/>`
  + (sad ? `<path d="M${x - 4*k} ${y + 7*k} Q${x} ${y + 3*k} ${x + 4*k} ${y + 7*k}" fill="none" stroke="${C.ink}" stroke-width="${2.6*k}" stroke-linecap="round"/>`
         : `<path d="M${x - 4*k} ${y + 4*k} Q${x} ${y + 8*k} ${x + 4*k} ${y + 4*k}" fill="none" stroke="${C.ink}" stroke-width="${2.6*k}" stroke-linecap="round"/>`)
  + `<ellipse cx="${x - 13*k}" cy="${y + 4*k}" rx="${3.6*k}" ry="${2.4*k}" fill="${C.pk}"/><ellipse cx="${x + 13*k}" cy="${y + 4*k}" rx="${3.6*k}" ry="${2.4*k}" fill="${C.pk}"/>`;
const ART = {
  bill:`<g transform="rotate(-6 60 60)"><rect x="14" y="34" width="92" height="52" rx="6" fill="#e9645b" ${S}/><rect x="22" y="42" width="76" height="36" rx="3" fill="none" stroke="${C.ink}" stroke-width="2" opacity=".45"/>
    <text x="30" y="60" font-family="Noto Sans TC,sans-serif" font-weight="900" font-size="15" fill="${C.ink}">100</text>${face(72, 58, .9)}</g>`,

const svg = k => `<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">${ART[k] || ART.bento}</svg>`;

/* ============ 狀態 ============ */
const $ = id => document.getElementById(id);
const board = $('board');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const X = { get(k){ try{ return JSON.parse(localStorage.getItem('pricethen2.' + k)); }catch(e){ return null; } },
  set(k, v){ try{ localStorage.setItem('pricethen2.' + k, JSON.stringify(v)); return true; }catch(e){ return false; } } };
function track(n, p){ try{ if(typeof gtag === 'function') gtag('event', n, p || {}); }catch(e){} }
let CFG = X.get('cfg') || JSON.parse(JSON.stringify(DEFAULT));
const photos = X.get('photos') || {};
let qi = -1;          // -1 開場；0..n-1 題目；n 結尾
let revealed = false, guess = 0, anim = null;

function pic(slot, fallback){ const u = photos[slot] || EMBED[slot]; return u ? `<img src="${u}" alt="">` : svg(fallback); }
const pct = (v, it) => Math.max(0, Math.min(100, v / it.max * 100));
function diffText(it){
  const d = it.now - it.old;
  if(d === 0) return {t:'一塊錢都沒漲', c:'same'};
  const p = Math.round(Math.abs(d) / it.old * 100);
  return d > 0 ? {t:`漲了 ${d} 元（+${p}%）`, c:'up'} : {t:`便宜了 ${-d} 元`, c:'same'};
}

function render(){
  const n = CFG.items.length;
  board.dataset.mode = qi < 0 ? 'intro' : qi >= n ? 'end' : 'play';
  $('billIm').innerHTML = pic('bill', 'bill');
  $('introTitle').textContent = CFG.intro; $('introSub').textContent = CFG.introSub;
  $('endHead').textContent = CFG.endHead; $('endTitle').textContent = CFG.end;
  if(qi >= n){
    $('sum').innerHTML = CFG.items.map((it, i) => { const d = it.now - it.old;
      return `<div><div class="im" data-slot="item-${i}">${pic('item-' + i, it.key)}</div><span>${esc(it.name)}</span><em>$${it.old} → $${it.now}</em>
        <b class="${d > 0 ? 'up' : 'same'}">${d > 0 ? '+' + d : d === 0 ? '±0' : d}</b></div>`; }).join('');
    return;
  }
  if(qi < 0) return;
  const it = CFG.items[qi];
  $('qno').textContent = `第 ${qi + 1} 題`;
  $('dots').innerHTML = CFG.items.map((_, i) => `<i class="${i <= qi ? 'on' : ''}"></i>`).join('');
  $('pic').innerHTML = `<div data-slot="item-${qi}" style="position:absolute;inset:0">${pic('item-' + qi, it.key)}</div>`;
  $('name').textContent = it.name;
  $('oldLabel').textContent = it.oldLabel; $('oldPrice').textContent = '$' + it.old;
  $('ask').textContent = '現在多少？';
  $('nowLabel').textContent = revealed ? it.nowLabel : '現在';
  $('maxLbl').textContent = '$' + it.max;
  $('oldMk').style.left = pct(it.old, it) + '%';
  drawGuess();
  $('flag').hidden = !revealed;
  $('nextBtn').textContent = !revealed ? '揭曉 →' : qi === n - 1 ? '看結尾 →' : '下一題 →';
  if(!revealed){
    $('ansBox').className = 'box ans wait'; $('now').textContent = '$?'; $('diff').textContent = '　'; $('say').innerHTML = '';
  } else {
    $('ansBox').className = 'box ans';
    $('now').textContent = '$' + it.now; $('flag').style.left = pct(it.now, it) + '%';
    showResult(it);
  }
}
function drawGuess(){
  const it = CFG.items[qi]; if(!it) return;
  $('guess').textContent = '$' + guess;
  $('thumb').style.left = pct(guess, it) + '%'; $('fill').style.width = pct(guess, it) + '%';
  $('guessSub').textContent = revealed ? (guess === it.now ? '猜中了！' : `差 ${Math.abs(guess - it.now)} 元`) : '拖滾輪';
}
function showResult(it){
  const d = diffText(it);
  $('diff').textContent = it.note || ' ';
  $('say').innerHTML = `<b class="${d.c}">${d.t}</b>`;
  $('guessSub').textContent = guess === it.now ? '猜中了！' : `差 ${Math.abs(guess - it.now)} 元`;
}
function startQ(i){
  qi = i; revealed = false; cancelAnimationFrame(anim);
  const it = CFG.items[qi]; if(it) guess = it.old;
  render();
}
function reveal(){
  const it = CFG.items[qi]; revealed = true;
  track('question_answered', {item: it.key, guess, answer: it.now});
  $('nowLabel').textContent = it.nowLabel; $('ansBox').className = 'box ans'; $('flag').hidden = false;
  $('nextBtn').textContent = qi === CFG.items.length - 1 ? '看結尾 →' : '下一題 →';
  $('now').textContent = '$' + it.now; $('flag').style.left = pct(it.now, it) + '%';
  showResult(it);
}
function go(){
  const n = CFG.items.length;
  if(qi < 0){ track('quiz_start'); return startQ(0); }
  if(qi >= n) return;
  if(!revealed) return reveal();
  if(qi < n - 1) return startQ(qi + 1);
  track('quiz_complete'); qi = n; render();
}
function back(){ if(qi > 0) startQ(Math.min(qi, CFG.items.length) - 1); else if(qi === 0){ qi = -1; render(); } }
$('nextBtn').onclick = go;
$('backBtn').onclick = back;
// 用滑鼠點卡片空白處也可以下一步（滾輪、按鈕除外）
board.addEventListener('click', e => { if(document.body.classList.contains('photo')) return; if(e.target.closest('.track, .next, .back')) return; go(); });
$('restartBtn').onclick = () => { qi = -1; revealed = false; render(); };

/* 滾輪拖曳 */
function setFromX(x){
  const it = CFG.items[qi]; if(!it || revealed) return;
  const r = $('track').getBoundingClientRect();
  guess = Math.round(Math.max(0, Math.min(1, (x - r.left) / r.width)) * it.max); drawGuess();
}
let dragging = false;
$('track').addEventListener('pointerdown', e => { if(document.body.classList.contains('photo')) return; dragging = true; $('track').setPointerCapture(e.pointerId); setFromX(e.clientX); });
$('track').addEventListener('pointermove', e => { if(dragging) setFromX(e.clientX); });
$('track').addEventListener('pointerup', () => { dragging = false; });
function nudge(d){ const it = CFG.items[qi]; if(!it || revealed || qi < 0) return; guess = Math.max(0, Math.min(it.max, guess + d)); drawGuess(); }

/* ============ 工具列 ============ */
const root = document.documentElement.style;
const THEMES = ['#16130e','#0b0b0c','#2b2b30','#f3f1ea','#10291e','#0f1d33','#291838'];
$('swatches').insertAdjacentHTML('beforeend', THEMES.map(c => `<button class="sw" style="background:${c}" data-c="${c}"></button>`).join('') + '<input type="color" id="pagePick">');
function setPage(c){ root.setProperty('--page', c); $('pagePick').value = c; X.set('page', c); }
function setBoard(c){ root.setProperty('--board', c); $('boardPick').value = c; X.set('board', c); }
function setScale(v){ root.setProperty('--scale', v / 100); $('sizePick').value = v; $('sizeVal').textContent = v + '%'; X.set('size', v); }
function setGrid(on){ document.body.classList.toggle('nogrid', !on); $('gridBtn').classList.toggle('on', on); X.set('grid', on); }
$('swatches').onclick = e => { const b = e.target.closest('.sw'); if(b) setPage(b.dataset.c); };
$('pagePick').oninput = e => setPage(e.target.value);
$('boardPick').oninput = e => setBoard(e.target.value);
$('sizePick').oninput = e => setScale(+e.target.value);
$('gridBtn').onclick = () => setGrid(document.body.classList.contains('nogrid'));
setPage(X.get('page') || THEMES[0]); setBoard(X.get('board') || '#ffd23a'); setScale(X.get('size') || 100); setGrid(X.get('grid') !== false);
let rec = false;
function setRec(on){ rec = on; document.body.classList.toggle('rec', on); $('recBtn').classList.toggle('on', on); if(on) toast('錄影模式：空白鍵揭曉／下一題，Esc 離開'); }
$('recBtn').onclick = () => setRec(!rec);
$('moreGames').addEventListener('click', () => track('more_games_click'));
$('igBtn').addEventListener('click', () => track('ig_click', {location:'intro'}));

/* 換照片 */
let slot = null;
$('photoBtn').onclick = () => { const on = !document.body.classList.contains('photo'); document.body.classList.toggle('photo', on); $('photoBtn').classList.toggle('on', on);
  toast(on ? '點要換的圖（開場鈔票、每題品項圖、結尾小圖）；右鍵還原' : '結束換照片'); };
board.addEventListener('click', e => { const t = e.target.closest('[data-slot]'); if(!t || !document.body.classList.contains('photo')) return; slot = t.dataset.slot; $('file').value = ''; $('file').click(); });
board.addEventListener('contextmenu', e => { const t = e.target.closest('[data-slot]'); if(!t || !document.body.classList.contains('photo')) return; e.preventDefault();
  delete photos[t.dataset.slot]; X.set('photos', photos); render(); toast('已還原'); });
$('file').onchange = () => {
  const f = $('file').files[0]; if(!f || !slot) return; const r = new FileReader(), im = new Image();
  r.onload = () => { im.onload = () => { const k = Math.min(1, 640 / Math.max(im.width, im.height)), c = document.createElement('canvas');
    c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    photos[slot] = c.toDataURL(/png/.test(f.type) ? 'image/png' : 'image/jpeg', .9);
    toast(X.set('photos', photos) ? '已換照片，重新整理也會留著' : '已換照片（關掉就會還原）'); render(); }; im.src = r.result; };
  r.readAsDataURL(f);
};

/* 改品項和價格 */
let draft = null;
const F = [['name','名稱'],['oldLabel','以前的標籤'],['old','以前價格'],['max','滾輪最大值'],['note','揭曉後小字'],['nowLabel','現在的標籤'],['now','現在價格']];
const NUM = ['old','now','max'];
function cardHTML(it, i){ return `<div class="card"><div class="bar"><small style="margin-right:auto">第 ${i + 1} 題</small><button data-mv="${i}" data-d="-1">▲</button><button data-mv="${i}" data-d="1">▼</button><button data-del="${i}">✕</button></div>
  <div class="g">${F.map(([f, l]) => `<label>${l}<input data-f="${f}" data-i="${i}" ${NUM.includes(f) ? 'type="number" min="0"' : ''} value="${esc(it[f])}"></label>`).join('')}</div></div>`; }
function drawOp(){ $('list').innerHTML = draft.items.map(cardHTML).join('');
  $('fIntro').value = draft.intro; $('fIntroSub').value = draft.introSub; $('fEndHead').value = draft.endHead; $('fEnd').value = draft.end; }
$('editBtn').onclick = () => { draft = JSON.parse(JSON.stringify(CFG)); drawOp(); $('opWrap').hidden = false; };
$('opWrap').addEventListener('input', e => { const t = e.target;
  if(t.dataset.f){ const it = draft.items[+t.dataset.i]; it[t.dataset.f] = NUM.includes(t.dataset.f) ? Math.max(0, +t.value || 0) : t.value; return; }
  const m = {fIntro:'intro', fIntroSub:'introSub', fEndHead:'endHead', fEnd:'end'}[t.id]; if(m) draft[m] = t.value; });
$('opWrap').addEventListener('click', e => { const t = e.target;
  if(t.id === 'opAdd'){ draft.items.push({key:'bento', name:'新品項', oldLabel:'以前', old:10, nowLabel:'現在', now:20, max:150, note:''}); drawOp(); }
  if(t.dataset.del !== undefined){ draft.items.splice(+t.dataset.del, 1); drawOp(); }
  if(t.dataset.mv !== undefined){ const L = draft.items, i = +t.dataset.mv, j = i + +t.dataset.d; if(j >= 0 && j < L.length){ [L[i], L[j]] = [L[j], L[i]]; drawOp(); } } });
$('opClose').onclick = () => { $('opWrap').hidden = true; };
$('opReset').onclick = () => { draft = JSON.parse(JSON.stringify(DEFAULT)); drawOp(); };
$('opSave').onclick = () => { draft.items.forEach(it => { it.max = Math.max(it.max, it.old, it.now, 1); }); CFG = draft; X.set('cfg', CFG); $('opWrap').hidden = true; qi = -1; revealed = false; render(); toast('已儲存'); };

document.addEventListener('keydown', e => {
  if(!$('opWrap').hidden){ if(e.key === 'Escape') $('opWrap').hidden = true; return; }
  const k = e.key.toLowerCase();
  if(e.code === 'Space' || k === 'enter'){ e.preventDefault(); go(); }
  else if(k === 'arrowright'){ e.preventDefault(); nudge(e.shiftKey ? 10 : 1); }
  else if(k === 'arrowleft'){ e.preventDefault(); nudge(e.shiftKey ? -10 : -1); }
  else if(k === 'backspace'){ e.preventDefault(); back(); }
  else if(k === 'r') setRec(!rec);
  else if(k === 'escape' && rec) setRec(false);
});
document.querySelectorAll('button').forEach(b => b.addEventListener('keydown', e => { if(e.code === 'Space') e.preventDefault(); }));
let tt; function toast(m){ const el = $('toast'); el.textContent = m; el.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('show'), 2200); }
render();
</script>
</body>
</html>
